<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1024px; height:500px; overflow:hidden;
         background: linear-gradient(135deg, #0071FD 0%, #0060df 100%);
         font-family: "Segoe UI", system-ui, sans-serif;
         display:flex; align-items:center; justify-content:center; gap:56px; }
  .mascotte { width:340px; height:340px; object-fit:contain;
              filter: drop-shadow(0 12px 28px rgba(0,0,0,.25)); }
  .testo { color:#fff; max-width:520px; }
  h1 { font-size:96px; font-weight:800; letter-spacing:-2px; line-height:1; }
  h1 .kimari-jp { font-size:34px; font-weight:600; opacity:.85; vertical-align:super; margin-left:14px; letter-spacing:0; }
  p.slogan { font-size:34px; font-weight:600; margin-top:18px; line-height:1.25; }
  p.sotto { font-size:22px; font-weight:400; margin-top:14px; opacity:.9; }
  .spunta { color:#34C759; }
</style></head>
<body>
  <img class="mascotte" src="mascotte-party.png" alt="">
  <div class="testo">
    <h1>Kimari<span class="kimari-jp">決まり</span></h1>
    <p class="slogan">Il gruppo vota, tu confermi. <span class="spunta">✓</span></p>
    <p class="sotto">Date, posti e spese decisi insieme — da un link, senza installare niente.</p>
  </div>
</body></html>
