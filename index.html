<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --label:#000; --sec:#6C6C70; --sep:rgba(60,60,67,.29);
    --fill:#E9E9EB; --blue:#007AFF; --blue-bg:#E8F1FF; --green:#34C759; --green-bg:#E7F8EC;
    --amber:#FF9500; --amber-bg:#FFF4E5; --red:#FF3B30;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#1C1C1E; --label:#FFF; --sec:#8E8E93; --sep:rgba(84,84,88,.65);
           --fill:#2C2C2E; --blue:#0A84FF; --blue-bg:#0B2A4F; --green:#30D158; --green-bg:#0F3A21;
           --amber:#FF9F0A; --amber-bg:#3A2A0B; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--label);
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
       padding-bottom:60px}
  .wrap{max-width:520px; margin:0 auto; padding:18px 16px}
  .card{background:var(--card); border-radius:18px; padding:20px 16px; text-align:center; box-shadow:0 1px 0 var(--sep)}
  .mplate{display:inline-flex; background:#fff; border-radius:24px; padding:8px 14px; box-shadow:0 0 0 .5px var(--sep)}
  h1{font-size:24px; margin:10px 0 2px; letter-spacing:-.3px}
  .sub{color:var(--sec); font-size:14px; margin:0}
  .badge{display:inline-block; margin-top:10px; padding:4px 11px; border-radius:100px; font-size:12px; font-weight:700}
  .badge.dec{background:var(--amber-bg); color:var(--amber)}
  .badge.ok{background:var(--green-bg); color:var(--green)}
  .badge.gray{background:var(--fill); color:var(--sec)}
  .stitle{font-size:13px; font-weight:600; color:var(--sec); text-transform:uppercase; letter-spacing:.4px; margin:22px 4px 8px; text-align:left}
  .group{background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 1px 0 var(--sep)}
  .opt{display:flex; align-items:center; gap:12px; width:100%; padding:13px 14px; border:0; background:none; font:inherit; color:var(--label); text-align:left; cursor:pointer}
  .opt + .opt, .row + .row, .prow + .prow{border-top:.5px solid var(--sep)}
  .chk{width:24px; height:24px; border-radius:50%; border:1.6px solid var(--sep); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px}
  .opt.on .chk{background:var(--green); border-color:var(--green)}
  .opt .t{font-weight:600}
  .opt .s, .prow .s{color:var(--sec); font-size:13px}
  .grow{flex:1; min-width:0}
  input[type=text], input[type=email], textarea, input[type=datetime-local]{
    width:100%; padding:12px 13px; border:0; border-radius:12px; background:var(--fill); font:inherit; color:var(--label); outline:none}
  .row{padding:9px 12px}
  .prow{display:flex; align-items:center; gap:12px; width:100%; padding:13px 14px; border:0; background:none; font:inherit; color:var(--label); text-align:left; cursor:pointer}
  .prow .t{font-weight:600}
  .chips{display:flex; flex-wrap:wrap; gap:8px; padding:12px}
  .chip{padding:8px 14px; border-radius:100px; background:var(--fill); border:0; font:inherit; font-size:14px; font-weight:600; color:var(--label); cursor:pointer}
  .chip.on{background:var(--blue); color:#fff}
  .seg{display:flex; background:var(--fill); border-radius:11px; padding:2px; margin:0 0 10px}
  .seg button{flex:1; padding:9px 6px; border:0; border-radius:9px; background:none; font:inherit; font-size:14px; font-weight:600; color:var(--label); cursor:pointer}
  .seg button.on{background:var(--card); box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .btn{display:block; width:100%; padding:15px; border:0; border-radius:14px; background:var(--blue); color:#fff; font:inherit; font-size:17px; font-weight:700; cursor:pointer; margin-top:18px; text-align:center; text-decoration:none}
  .btn.sec{background:var(--fill); color:var(--blue)}
  .btn.danger{background:none; color:var(--red); font-weight:600; font-size:15px; margin-top:6px}
  .btn:disabled{opacity:.45}
  .foot{color:var(--sec); font-size:12.5px; text-align:center; margin-top:14px}
  .fnote{color:var(--sec); font-size:12.5px; text-align:left; margin:6px 4px 0}
  .err{background:var(--amber-bg); color:var(--amber); border-radius:12px; padding:11px 13px; font-size:14px; margin-top:14px; display:none}
  .kimari{color:var(--green); font-weight:800; font-size:26px; letter-spacing:-.3px}
  .when-big{font-size:19px; font-weight:700; margin-top:8px}
  .where-big{font-size:16px; margin-top:2px}
  a{color:var(--blue)}
  .linkbox{background:var(--fill); border-radius:12px; padding:12px; font-size:13.5px; word-break:break-all; margin-top:12px; text-align:left}
  .brand{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:26px; color:var(--sec); font-size:13px}
  .brand img{width:22px; height:22px; border-radius:6px}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .topbar a{font-weight:600; text-decoration:none; font-size:15px}
  .rseg{display:flex; gap:8px}
  .rseg button{flex:1; padding:12px 6px; border:0; border-radius:12px; background:var(--fill); font:inherit; font-weight:700; color:var(--label); cursor:pointer}
  .rseg button.on.yes{background:var(--green); color:#fff}
  .rseg button.on.maybe{background:var(--amber); color:#fff}
  .rseg button.on.no{background:var(--fill); color:var(--red); box-shadow:inset 0 0 0 1.5px var(--red)}
</style>
</head>

  'Tocca per entrare. Ti chiederemo solo il nome.': {
    en: 'Tap to join. We’ll only ask for your name.',
    es: 'Toca para entrar. Solo te pediremos el nombre.',
    de: 'Tippen zum Beitreten. Wir fragen nur nach deinem Namen.',
    ja: 'タップして参加。お名前だけうかがいます。'
  },

  /* -------------------------------------------------------- amici e conto */
  'Gli amici servono per invitare in fretta quando crei un gruppo. Non vedono i tuoi piani: la visibilità resta per gruppo.': {
    en: 'Friends are there so you can invite people quickly when you create a group. They don’t see your plans — visibility stays per group.',
    es: 'Los amigos sirven para invitar rápido cuando creas un grupo. No ven tus planes: la visibilidad sigue siendo por grupo.',
    de: 'Freunde sind dazu da, dass du beim Erstellen einer Gruppe schnell einladen kannst. Sie sehen deine Pläne nicht — Sichtbarkeit bleibt pro Gruppe.',
    ja: '友だちは、グループを作るときにすぐ招待するためのものです。あなたの予定は見えません。公開範囲はグループごとのままです。'
  },
  'Persone con cui hai già un gruppo o un piano. Gli amici non vedono i tuoi piani: servono solo per invitare in fretta.': {
    en: 'People you already share a group or a plan with. Friends don’t see your plans — they’re just there for quick invites.',
    es: 'Personas con las que ya compartes un grupo o un plan. Los amigos no ven tus planes: solo sirven para invitar rápido.',
    de: 'Leute, mit denen du schon eine Gruppe oder einen Plan teilst. Freunde sehen deine Pläne nicht — sie sind nur für schnelle Einladungen da.',
    ja: 'すでにグループや予定を共有している人たちです。友だちにあなたの予定は見えません。すぐ招待するためだけのものです。'
  },
  'Il nome è quello che vedono gli altri nei piani.': {
    en: 'This is the name other people see in plans.',
    es: 'Este es el nombre que los demás ven en los planes.',
    de: 'Diesen Namen sehen die anderen in den Plänen.',
    ja: '予定のなかで、ほかの人に表示される名前です。'
  },
  'Email': { en: 'Email', es: 'Correo', de: 'E-Mail', ja: 'メール' },
  'Collega i piani dal web': { en: 'Bring in your plans from the web',
    es: 'Vincula tus planes de la web', de: 'Pläne aus dem Web verbinden',
    ja: 'ウェブでの予定をつなげる' },
  'L\'email che hai usato sul web': {
    en: 'The email you used on the web', es: 'El correo que usaste en la web',
    de: 'Die E-Mail, die du im Web benutzt hast', ja: 'ウェブで使ったメールアドレス' },
  'Se hai votato da un link senza app e hai lasciato l\'email, scrivila qui: i tuoi voti e risposte passano a questo account.': {
    en: 'If you voted from a link without the app and left your email, type it here: your votes and answers move over to this account.',
    es: 'Si votaste desde un enlace sin la app y dejaste tu correo, escríbelo aquí: tus votos y respuestas pasan a esta cuenta.',
    de: 'Wenn du über einen Link ohne App abgestimmt und deine E-Mail hinterlassen hast, trag sie hier ein: Deine Stimmen und Antworten wandern zu diesem Konto.',
    ja: 'アプリなしでリンクから投票し、メールアドレスを残していた場合はここに入力してください。投票と回答がこのアカウントに移ります。'
  },
  'Nell\'app vera arriva un codice a quell\'email, per sicurezza.': {
    en: 'In the real app a code goes to that address, for safety.',
    es: 'En la app real llega un código a ese correo, por seguridad.',
    de: 'In der echten App geht ein Code an diese Adresse — zur Sicherheit.',
    ja: '実際のアプリでは、安全のためそのアドレスに確認コードが届きます。'
  },
  'Nessuna newsletter: una sola email quando viene confermato. La stessa email ti permette di ritrovare questo piano se poi installi l\'app.': {
    en: 'No newsletter — one email when it’s confirmed. That same address lets you find this plan again if you install the app later.',
    es: 'Sin newsletter: un solo correo cuando se confirme. Ese mismo correo te permite recuperar este plan si luego instalas la app.',
    de: 'Kein Newsletter — eine E-Mail, wenn es bestätigt ist. Mit derselben Adresse findest du diesen Plan wieder, falls du die App später installierst.',
    ja: 'ニュースレターはありません。確定したときに一通だけ届きます。同じアドレスで、あとからアプリを入れてもこの予定を見つけられます。'
  },
  'Ogni voce è tua. Un gruppo si silenzia dalla sua pagina (Gestisci / Info). Quello che non arriva come push resta comunque in Novità.': {
    en: 'Every setting here is yours. A group is muted from its own page (Manage / Info). Whatever doesn’t arrive as a push is still waiting in News.',
    es: 'Cada ajuste es tuyo. Un grupo se silencia desde su propia página (Gestionar / Info). Lo que no llegue como notificación sigue estando en Novedades.',
    de: 'Jede Einstellung hier gehört dir. Eine Gruppe wird auf ihrer eigenen Seite stummgeschaltet (Verwalten / Info). Was nicht als Push ankommt, wartet trotzdem unter Neues.',
    ja: 'ここの設定はすべてあなたのものです。グループはそのページ（管理／情報）から通知オフにできます。プッシュで届かなかったものも「新着」には残ります。'
  },
  'Ancora niente: quando qualcuno vota, conferma o risponde a un piano, compare qui.': {
    en: 'Nothing yet. When someone votes, confirms or replies to a plan, it shows up here.',
    es: 'Todavía nada. Cuando alguien vote, confirme o responda a un plan, aparecerá aquí.',
    de: 'Noch nichts. Sobald jemand abstimmt, bestätigt oder auf einen Plan antwortet, erscheint es hier.',
    ja: 'まだ何もありません。だれかが投票・確定・返信すると、ここに表示されます。'
  },
  '🔔 = con le tue impostazioni sarebbe arrivata una notifica.': {
    en: '🔔 = with your settings, this would have come as a notification.',
    es: '🔔 = con tus ajustes, esto habría llegado como notificación.',
    de: '🔔 = mit deinen Einstellungen wäre das als Benachrichtigung gekommen.',
    ja: '🔔 ＝ 現在の設定なら、これは通知として届いていたものです。'
  },

  /* ---------------------------------------------------- piani e proposte */
  'Aggiungi al piano': { en: 'Add to the plan', es: 'Añadir al plan',
                         de: 'Zum Plan hinzufügen', ja: '予定に追加' },
  'Aggiungi una domanda': { en: 'Add a question', es: 'Añadir una pregunta',
                            de: 'Frage hinzufügen', ja: '質問を追加' },
  'Proponi al gruppo': { en: 'Suggest it to the group', es: 'Propónselo al grupo',
                         de: 'Der Gruppe vorschlagen', ja: 'みんなに提案' },
  'Proponi un\'altra data': { en: 'Suggest another date', es: 'Proponer otra fecha',
                              de: 'Anderes Datum vorschlagen', ja: '別の日を提案' },
  'Ripeti questo piano': { en: 'Do this again', es: 'Repetir este plan',
                           de: 'Diesen Plan wiederholen', ja: 'この予定をもう一度' },
  'Avvisa il gruppo': { en: 'Tell the group', es: 'Avisar al grupo',
                        de: 'Der Gruppe Bescheid geben', ja: 'みんなに知らせる' },
  'Tutto il giorno': { en: 'All day', es: 'Todo el día', de: 'Ganztägig', ja: '終日' },
  'Non so': { en: 'Not sure', es: 'No sé', de: 'Weiß nicht', ja: 'わからない' },
  'Si vota insieme a quando e dove.': {
    en: 'It’s voted on together with when and where.',
    es: 'Se vota junto con el cuándo y el dónde.',
    de: 'Wird zusammen mit Wann und Wo abgestimmt.',
    ja: '日時・場所といっしょに投票します。'
  },
  'Due bottoni, 👍 Sì e 👎 No. Il voto vale subito, vince la maggioranza di chi risponde.': {
    en: 'Two buttons, 👍 Yes and 👎 No. The vote counts straight away; whoever answers, the majority wins.',
    es: 'Dos botones, 👍 Sí y 👎 No. El voto cuenta al momento y gana la mayoría de quienes respondan.',
    de: 'Zwei Knöpfe, 👍 Ja und 👎 Nein. Die Stimme zählt sofort; es gewinnt die Mehrheit derer, die antworten.',
    ja: 'ボタンは 👍 はい と 👎 いいえ の二つ。投票はすぐ反映され、答えた人の多数決で決まります。'
  },
  'Ogni data ha il suo "ci sono". Modifiche e proposte valgono per una data sola.': {
    en: 'Each date has its own “I’m in”. Changes and suggestions apply to one date only.',
    es: 'Cada fecha tiene su propio «voy». Los cambios y las propuestas valen para una sola fecha.',
    de: 'Jedes Datum hat sein eigenes „Ich bin dabei“. Änderungen und Vorschläge gelten für ein einzelnes Datum.',
    ja: '日付ごとに「参加する」があります。変更や提案は、その日付だけに効きます。'
  },
  'Crea un piano in 30 secondi, direttamente da qui.': {
    en: 'Make a plan in 30 seconds, right from here.',
    es: 'Crea un plan en 30 segundos, directamente desde aquí.',
    de: 'Mach in 30 Sekunden einen Plan, direkt von hier.',
    ja: 'ここから 30 秒で予定を作れます。'
  },
  'Tocca "Ci sono" per rispondere: ti chiederemo solo il nome.': {
    en: 'Tap “I’m in” to answer — we’ll only ask for your name.',
    es: 'Toca «Voy» para responder: solo te pediremos el nombre.',
    de: 'Tippe auf „Ich bin dabei“ — wir fragen nur nach deinem Namen.',
    ja: '「参加する」を押して返事してください。お名前だけうかがいます。'
  },
  'Tutti lo vedono nel piano, senza cercare il messaggio in chat.': {
    en: 'Everyone sees it in the plan, without digging for the message in the chat.',
    es: 'Todos lo ven en el plan, sin buscar el mensaje en el chat.',
    de: 'Alle sehen es im Plan, ohne die Nachricht im Chat zu suchen.',
    ja: 'チャットからメッセージを探さなくても、みんなが予定の中で見られます。'
  },

  /* -------------------------------------------------- se il piano salta */
  'Se salta, dirlo qui è meglio che sparire: chi ha il link lo vede, e messaggi e spese restano.': {
    en: 'If it falls through, saying so here beats vanishing: whoever has the link sees it, and messages and expenses stay put.',
    es: 'Si se cae, decirlo aquí es mejor que desaparecer: quien tenga el enlace lo ve, y los mensajes y los gastos siguen ahí.',
    de: 'Wenn es platzt, ist es besser, das hier zu sagen, als zu verschwinden: Wer den Link hat, sieht es, und Nachrichten und Ausgaben bleiben.',
    ja: '中止になったら、黙って消えるよりここで伝えるほうが親切です。リンクを持つ人には表示され、メッセージや費用はそのまま残ります。'
  },
  'Il link resta valido: chi lo apre vede che è saltato. Messaggi e spese restano dove sono.': {
    en: 'The link still works — whoever opens it sees that it’s off. Messages and expenses stay where they are.',
    es: 'El enlace sigue siendo válido: quien lo abra verá que se ha cancelado. Los mensajes y los gastos se quedan donde están.',
    de: 'Der Link bleibt gültig — wer ihn öffnet, sieht, dass es abgesagt ist. Nachrichten und Ausgaben bleiben, wo sie sind.',
    ja: 'リンクはそのまま使えます。開いた人には中止になったことが表示されます。メッセージや費用はそのまま残ります。'
  },
  'Il tuo "ci sono" diventa "non vengo" e il gruppo lo vede subito.': {
    en: 'Your “I’m in” becomes “I’m out”, and the group sees it right away.',
    es: 'Tu «voy» pasa a «no voy» y el grupo lo ve enseguida.',
    de: 'Aus deinem „Ich bin dabei“ wird „Ich komme nicht“, und die Gruppe sieht es sofort.',
    ja: '「参加する」が「行けない」に変わり、みんなにすぐ伝わります。'
  },
  'Es. esco tardi dal lavoro': { en: 'E.g. I’m getting out of work late',
    es: 'Ej. salgo tarde del trabajo', de: 'Z.B. ich komme spät aus der Arbeit',
    ja: '例：仕事が遅くなりそう' },
  'Es. per me va bene tutto ma non troppo tardi': {
    en: 'E.g. anything works for me, just not too late',
    es: 'Ej. me viene bien todo, pero no muy tarde',
    de: 'Z.B. mir passt alles, nur nicht zu spät',
    ja: '例：どれでもいいですが、あまり遅くない時間で' },

  /* ------------------------------------------------------- posti e spese */
  'Elimina posto': { en: 'Delete place', es: 'Eliminar sitio',
                     de: 'Ort löschen', ja: '場所を削除' },
  '★ Posto salvato · apri scheda': { en: '★ Saved place · open card',
    es: '★ Sitio guardado · abrir ficha', de: '★ Gespeicherter Ort · Karte öffnen',
    ja: '★ 保存した場所 · カードを開く' },
  '📷 Foto del menu': { en: '📷 Photo of the menu', es: '📷 Foto del menú',
                        de: '📷 Foto der Karte', ja: '📷 メニューの写真' },
  'Il ristorante di sempre, il campo, la casa al mare: nome, indirizzo e allegati tuoi (il menu fotografato). Quando lo usi in un piano, gli altri vedono solo nome e indirizzo.': {
    en: 'The usual restaurant, the pitch, the house by the sea: name, address and your own attachments (the menu you photographed). When you use it in a plan, the others only see name and address.',
    es: 'El restaurante de siempre, la cancha, la casa en la playa: nombre, dirección y tus propios adjuntos (el menú fotografiado). Cuando lo usas en un plan, los demás solo ven el nombre y la dirección.',
    de: 'Das Stammlokal, der Platz, das Haus am Meer: Name, Adresse und deine eigenen Anhänge (die abfotografierte Karte). Wenn du den Ort in einem Plan verwendest, sehen die anderen nur Name und Adresse.',
    ja: 'いつもの店、コート、海辺の家。名前と住所、そしてあなただけの添付（撮っておいたメニューなど）。予定で使うとき、ほかの人に見えるのは名前と住所だけです。'
  },
  '★ = copertina: è la foto che vedi in giro per l\'app e nei piani in cui usi il posto.': {
    en: '★ = cover: the photo you’ll see around the app and in the plans where you use this place.',
    es: '★ = portada: es la foto que verás por la app y en los planes donde uses el sitio.',
    de: '★ = Titelbild: das Foto, das dir in der App und in Plänen mit diesem Ort begegnet.',
    ja: '★ ＝ カバー写真。アプリのあちこちや、この場所を使った予定で表示されます。'
  },
  'La spesa pesa solo su chi scegli: "Marco ha pagato la cena di Silvio" = paga Marco, scegli solo Silvio. Chi paga può anche non esserci.': {
    en: 'The expense falls only on the people you pick: “Marco paid for Silvio’s dinner” = Marco pays, you pick only Silvio. Whoever paid doesn’t have to be among them.',
    es: 'El gasto recae solo sobre quien elijas: «Marco pagó la cena de Silvio» = paga Marco, eliges solo a Silvio. Quien paga puede no estar incluido.',
    de: 'Die Ausgabe trifft nur die, die du auswählst: „Marco hat Silvios Essen bezahlt“ = Marco zahlt, du wählst nur Silvio. Wer zahlt, muss nicht dabei sein.',
    ja: '費用は選んだ人にだけかかります。「マルコがシルヴィオの夕食を払った」＝ 払うのはマルコ、選ぶのはシルヴィオだけ。払った人が対象に入っていなくてもかまいません。'
  },
  'Membro eliminato': { en: 'Deleted member', es: 'Miembro eliminado',
                        de: 'Gelöschtes Mitglied', ja: '退会したメンバー' },

  /* ----------------------------------------- app: spiegazioni piu' lunghe */
  'Le sezioni (Roma, Bari…) sono tue e solo tue: servono a ordinare le cerchie, non le vedono gli altri. Ogni gruppo è privato: si entra solo su invito.': {

// Normalizza anche gli apostrofi e le virgolette tipografiche: nel codice si
// scrive "un'opinione" con l'apostrofo dritto, nei testi curati viene naturale
// scrivere "un’opinione". Sono due caratteri diversi, e senza questo la voce
// non verrebbe mai trovata — senza errori, senza avvisi: uscirebbe l'italiano
// e nessuno capirebbe perché.
const NORM = s => String(s)
  .replace(/[‘’ʼ]/g, "'")
  .replace(/[“”]/g, '"')
  .replace(/\s+/g, ' ')
  .trim();

// Indice normalizzato: nel codice le stringhe vanno a capo dentro i template,
// e "Segna tutte\n  le opzioni" deve trovare la stessa voce di "Segna tutte le
// opzioni".
const INDICE = new Map(Object.entries(DIZIONARIO).map(([k, v]) => [NORM(k), v]));

function scegliLingua(preferite, forzata) {
  if (forzata && LINGUE[forzata]) return forzata;
  for (const p of (preferite || [])) {
    const due = String(p).slice(0, 2).toLowerCase();
    if (LINGUE[due]) return due;
  }
  return 'it';
}

// Torna una funzione t() legata a una lingua. Se la voce manca, o manca quella
// lingua, esce l'italiano: mai una chiave a video, mai una stringa vuota.
function traduttore(lingua) {
  return function t(testo, valori) {
    const voce = lingua === 'it' ? null : INDICE.get(NORM(testo));
    let out = (voce && voce[lingua]) || testo;
    // I segnaposto si sostituiscono DOPO aver scelto la lingua, così ogni
    // lingua può metterli dove le servono.
    if (valori) {
      for (const k of Object.keys(valori)) out = out.split('{' + k + '}').join(String(valori[k]));
    }
    return out;
  };
}

const quanteMancano = lingua =>
  Object.values(DIZIONARIO).filter(v => !v[lingua]).length;

// La lingua è quella del dispositivo: nessun selettore da cercare, e chi
// riceve il link da un amico all'estero legge nella sua lingua senza fare niente.
const LINGUA = scegliLingua(navigator.languages || [navigator.language]);
const t = traduttore(LINGUA);
document.documentElement.lang = LINGUA;

const sb = window.supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q = new URLSearchParams(location.search);
const token = Q.get('t');
const pid = Q.get('p');

const LSK = 'kimari_tokens';
const tokStore = () => { try{ return JSON.parse(localStorage.getItem(LSK) || '{}'); }catch(_){ return {}; } };
const saveTok = (planId, t) => { try{ const m = tokStore(); m[planId] = t; localStorage.setItem(LSK, JSON.stringify(m)); }catch(_){} };
const planUrl = id => { const t = tokStore()[id]; return location.origin + location.pathname + (t ? '?t=' + t : '?p=' + id); };

let SESSION = null;
let preview = null;    // dati dal token (o normalizzati da ?p)
let FULL = null;       // dati completi via RLS (solo con sessione)
let ME = null;         // { id } actor
const sel = { when: new Set(), where: new Set() };
let claim = null;

const fmtWhen = c => {
  if (!c || !c.starts_at) return '';
  const d = new Date(c.starts_at);
  const opts = c.all_day ? { weekday:'short', day:'numeric', month:'long' }
                         : { weekday:'short', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' };
  // LINGUA e non `undefined`: `undefined` prende la lingua del sistema, che
  // può essere diversa da quella che l'interfaccia ha scelto. Chi ha il
  // telefono in inglese e il browser in italiano vedeva testo italiano e date
  // inglesi nella stessa schermata. Il fuso resta quello del dispositivo, che
  // è sempre giusto: è l'ora in cui quella persona deve presentarsi.
  let out = d.toLocaleString(LINGUA, opts);
  if (c.ends_at && !c.all_day) out += ' – ' + new Date(c.ends_at).toLocaleTimeString(LINGUA, { hour:'2-digit', minute:'2-digit' });
  return out.charAt(0).toUpperCase() + out.slice(1);
};
const err = m => { const e = $('#err'); if(e){ e.textContent = m; e.style.display = 'block'; } };
const brand = `<div class="brand"><img src="${ICON}" alt=""> ${t('Fatto con')} <b>&nbsp;Kimari</b></div>`;
const topbar = (right) => `<div class="topbar"><a href="${location.pathname}">‹ Kimari</a>${right || '<span></span>'}</div>`;

async function ensureSession(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) return session;
  const { data, error } = await sb.auth.signInAnonymously();
  if (error){ const ex = new Error('anon'); ex.anonDetail = error.message || String(error); throw ex; }
  return data.session;
}
function anonErr(e, fallback){
  if (e && e.anonDetail !== undefined)
    err('Accesso rifiutato da Supabase. Dettaglio: «' + e.anonDetail + '»' +
        (String(e.anonDetail).toLowerCase().includes('captcha') ? ' → disattiva il CAPTCHA in Authentication → Attack Protection.' : ' → controlla Allow anonymous sign-ins + Save.'));
  else err(fallback + ' Dettaglio: «' + ((e && e.message) || e) + '»');
}

/* ============================== AVVIO ============================== */
async function boot(){
  // Se qui va storto qualcosa ME resta null e un organizzatore vero si ritrova
  // la vista ospite: il motivo va detto, non ingoiato (regola 5).
  let bootErr = null;
  try{
    const { data: { session }, error: ge } = await sb.auth.getSession();
    if (ge) throw ge;
    SESSION = session;
    if (session){
      const { data: meRow, error: ae } = await sb.from('actors').select('id, display_name').eq('auth_user_id', session.user.id).maybeSingle();
      if (ae) throw ae;
      ME = meRow || null;

      // Ritorno da un collegamento con Google: l'actor c'è già, ma porta il
      // nome che la persona aveva scritto per votare da ospite. Ora che sappiamo
      // come si chiama davvero, si adotta quello — insieme all'email, che serve
      // ad avvisarla quando il piano viene confermato.
      let daCollegare = false;
      try{ daCollegare = localStorage.getItem(PENDING_LINK) === '1'; }catch(_){}
      if (ME && daCollegare && !session.user.is_anonymous){
        try{ localStorage.removeItem(PENDING_LINK); }catch(_){}
        const md = session.user.user_metadata || {};
        const nm = md.full_name || md.name || (session.user.email || '').split('@')[0];
        try{
          if (nm) await sb.rpc('ensure_actor', { p_display_name: nm });
          if (session.user.email) await sb.rpc('set_my_email', { p_email: session.user.email });
          const { data: agg } = await sb.from('actors').select('id, display_name')
            .eq('auth_user_id', session.user.id).maybeSingle();
          if (agg) ME = agg;
        }catch(e){ console.error('boot/adozione nome', e);
                   bootErr = 'Sei entrato con Google ma non sono riuscito ad aggiornare il tuo nome. Dettaglio: «' + ((e && e.message) || e) + '»'; }
      }

      if (!ME && !session.user.is_anonymous){
        const md = session.user.user_metadata || {};
        const nm = md.full_name || md.name || (session.user.email || 'Kimari').split('@')[0];
        try{ const { error: ee } = await sb.rpc('ensure_actor', { p_display_name: nm });
             if (ee) throw ee;
             const { data: again, error: a2 } = await sb.from('actors').select('id, display_name').eq('auth_user_id', session.user.id).maybeSingle();
             if (a2) throw a2;
             ME = again || null;
        }catch(e){ console.error('boot/ensure_actor', e);
                   bootErr = 'Non sono riuscito a creare il tuo profilo, quindi mi vedi come ospite. Dettaglio: «' + ((e && e.message) || e) + '»'; }
      }
    }
  }catch(e){
    console.error('boot/sessione', e);
    bootErr = 'Non sono riuscito a leggere la tua sessione, quindi mi vedi come ospite. Dettaglio: «' + ((e && e.message) || e) + '»';
  }
  // await: le viste scrivono #err solo dopo aver reso il DOM
  if (Q.get('new') !== null) await renderCreate();
  else if (token) await loadByToken();
  else if (pid) await loadById(pid);
  else if (ME) await loadHome();
  else await renderWelcome();
  if (bootErr) err(bootErr);
}

// Chi collega Google a una sessione da ospite torna qui con l'actor che aveva
// già: si chiama ancora col nome buttato lì per votare. Il segno lasciato prima
// del salto dice al boot di adottare il nome vero al ritorno.
const PENDING_LINK = 'kimari_link_google';

async function googleAuth(){
  try{
    if (SESSION && SESSION.user.is_anonymous){
      try{ localStorage.setItem(PENDING_LINK, '1'); }catch(_){}
      const { error } = await sb.auth.linkIdentity({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
      if (error) throw error;
    } else {
      const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
      if (error) throw error;
    }
  }catch(e){
    const m = String(e && e.message || '');
    if (m.toLowerCase().includes('not enabled')) err('Google non è ancora attivo su Supabase: Authentication → Providers → Google.');
    else if (m.toLowerCase().includes('already') && m.toLowerCase().includes('link')) err('Questo account Google è già collegato altrove: tocca Esci e poi entra con Google.');
    else err('Google non risponde: «' + m + '»');
  }
}
async function doSignOut(){ try{ await sb.auth.signOut(); }catch(_){} location.href = location.pathname; }

    <p class="sub">${t("Tutti hanno un'opinione.")}<br>${t('Kimari la trasforma in un piano.')}</p>

  </div>

  <p class="foot">${t('Proponi date e posti, il gruppo vota dal link su WhatsApp senza installare niente, tu confermi. Kimari! ✅')}<br>${t('Con Google ritrovi i tuoi piani da qualsiasi telefono.')}</p>
  ${brand}`;
  const gb = $('#gbtn'); if (gb) gb.addEventListener('click', googleAuth);

async function loadHome(){
  try{
    const [plansQ, partsQ] = await Promise.all([
      sb.from('plans').select('id, title, status, starts_at, all_day, place_name, organizer_id, created_at').order('created_at', { ascending:false }),
      sb.from('participants').select('plan_id, role, rsvp').eq('actor_id', ME.id)
    ]);
    renderHome(plansQ.data || [], partsQ.data || []);
  }catch(_){ renderWelcome(); }
}

function renderHome(plans, parts){
  const roleOf = id => { const p = parts.find(x => x.plan_id === id); return p ? p.role : null; };
  const open = plans.filter(p => p.status === 'deciding');
  const conf = plans.filter(p => p.status === 'confirmed');
  const row = p => `<a class="prow" style="text-decoration:none" href="${planUrl(p.id)}">
      <span class="grow"><span class="t">${esc(p.title)}</span>
        <div class="s">${p.status === 'deciding' ? 'Ai voti' : (p.starts_at ? fmtWhen(p) : 'Confermato')}${p.place_name ? ' · ' + esc(p.place_name) : ''}${roleOf(p.id) === 'organizer' ? ' · organizzi tu' : ''}</div>
      </span><span class="badge ${p.status === 'deciding' ? 'dec' : 'ok'}" style="margin:0">${p.status === 'deciding' ? 'ai voti' : '✓'}</span></a>`;
  $('#app').innerHTML = `
  <div class="card">
    <img src="${ICON}" width="64" style="border-radius:16px" alt="">
    <h1>${esc(ME.display_name || 'Kimari')}</h1>
    <p class="sub">${t('I tuoi piani su questo telefono')}</p>

function renderCreate(){

  $('#app').innerHTML = `${topbar()}
  <div class="card"><h1>${t('Nuovo piano')}</h1><p class="sub">${t('Il gruppo vota dal link, tu confermi.')}</p></div>
  <div class="stitle">${t('Il piano')}</div>
  <div class="group">
    <div class="row"><input type="text" id="c-title" placeholder="Es. Pizzata di venerdì" maxlength="80" value="${esc(cdraft.title || '')}"></div>
    ${ME ? '' : `<div class="row"><input type="text" id="c-name" placeholder="${t('Il tuo nome (organizzatore)')}" maxlength="40" value="${esc(cdraft.name || '')}"></div>`}
  </div>
  <div class="stitle">${t('Quando')}</div>
  <div class="seg"><button data-wm="deciding" class="${wm === 'deciding' ? 'on' : ''}">${t('Ai voti')}</button><button data-wm="fixed" class="${wm === 'fixed' ? 'on' : ''}">${t('Già deciso')}</button></div>

  <div class="seg"><button data-dm="deciding" class="${dm === 'deciding' ? 'on' : ''}">${t('Ai voti')}</button><button data-dm="fixed" class="${dm === 'fixed' ? 'on' : ''}">${t('Già deciso')}</button><button data-dm="later" class="${dm === 'later' ? 'on' : ''}">Si vedrà</button></div>
  ${dm === 'later' ? '' : `<div class="group">${dm === 'deciding'
    ? [1,2,3].map(i => `<div class="row"><input type="text" id="c-p${i}" placeholder="${t('Posto {n}', { n: i })}" maxlength="60"></div>`).join('')
    : `<div class="row"><input type="text" id="c-pf" placeholder="${t('Nome del posto')}" maxlength="60"></div><div class="row"><input type="text" id="c-pa" placeholder="${t('Indirizzo (facoltativo)')}" maxlength="80"></div>`}</div>`}
  <div class="stitle">Si chiude</div>
  <div class="group"><div class="row"><input type="datetime-local" id="c-dl"></div></div>
  <p class="fnote">${t('Facoltativo, è solo un promemoria per il gruppo: la conferma resta tua.')}</p>
  <div class="err" id="err"></div>
  <button class="btn" id="create">Crea e dammi il link</button>
  <div id="out"></div>
  ${brand}`;
  document.querySelectorAll('[data-wm]').forEach(b => b.addEventListener('click', () => { keepDraft(); cdraft.whenMode = b.dataset.wm; renderCreate(); }));
  document.querySelectorAll('[data-dm]').forEach(b => b.addEventListener('click', () => { keepDraft(); cdraft.whereMode = b.dataset.dm; renderCreate(); }));
  $('#create').addEventListener('click', createPlan);
}
function keepDraft(){
  cdraft.title = ($('#c-title') || {}).value || cdraft.title;
  if ($('#c-name')) cdraft.name = $('#c-name').value;
}

async function createPlan(){
  const title = $('#c-title').value.trim();
  const name = ME ? null : ($('#c-name') ? $('#c-name').value.trim() : '');
  if (!title) return err('Serve un titolo.');
  if (!ME && !name) return err('Serve il tuo nome.');
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const p = { title, when_mode: cdraft.whenMode, where_mode: cdraft.whereMode };
  if (cdraft.whenMode === 'deciding'){
    p.when_candidates = [1,2,3,4,5].map(i => ($('#c-w' + i) || {}).value).filter(Boolean)
      .map(v => ({ starts_at: new Date(v).toISOString(), timezone: tz }));
    if (!p.when_candidates.length) return err('Proponi almeno una data.');
  } else {
    const v = $('#c-wf').value; if (!v) return err('Metti la data.');
    p.starts_at = new Date(v).toISOString(); p.timezone = tz;
  }
  if (cdraft.whereMode === 'deciding'){
    p.where_candidates = [1,2,3].map(i => ($('#c-p' + i) || {}).value.trim()).filter(Boolean).map(n => ({ place_name: n }));
    if (!p.where_candidates.length) return err('Proponi almeno un posto (o scegli "Si vedrà").');
  } else if (cdraft.whereMode === 'fixed'){
    const n = $('#c-pf').value.trim(); if (!n) return err('Metti il nome del posto.');
    p.place_name = n; p.place_address = $('#c-pa').value.trim() || null;
  }
  const dl = $('#c-dl').value; if (dl) p.deadline_at = new Date(dl).toISOString();

  const btn = $('#create'); btn.disabled = true; btn.textContent = 'Creo…';
  try{
    await ensureSession();
    if (!ME){ await sb.rpc('ensure_actor', { p_display_name: name }); }
    const { data, error } = await sb.rpc('create_plan', { p });
    if (error) throw error;
    saveTok(data.plan_id, data.token);
    try{ await sb.rpc('log_event', { p_name:'plan_created', p_plan: data.plan_id, p_props:{} }); }catch(_){}
    const link = location.origin + location.pathname + '?t=' + data.token;
    const wa = 'https://wa.me/?text=' + encodeURIComponent(`${title} — vota qui: ${link}`);
    $('#out').innerHTML = `<div class="stitle">${t('Fatto ✓ — il link del piano')}</div>
      <div class="linkbox">${esc(link)}</div>
      <button class="btn sec" id="copy">Copia il link</button>
      <a class="btn" style="text-decoration:none" href="${wa}">${t('Manda su WhatsApp')}</a>
      <a class="btn sec" style="text-decoration:none" href="?t=${data.token}">${t('Apri il piano')}</a>`;
    $('#copy').addEventListener('click', () => { navigator.clipboard.writeText(link); $('#copy').textContent = 'Copiato ✓'; });
    btn.remove();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Crea e dammi il link';
    anonErr(e, 'Non riesco a creare il piano.');
  }
}

/* ============================== CARICAMENTO PIANO ============================== */
async function loadByToken(){
  try{ await sb.rpc('log_event', { p_name:'invite_opened', p_plan:null, p_props:{} }); }catch(_){}
  const { data, error } = await sb.rpc('preview_invite', { p_token: token });
  if (error || !data || !data.ok) return renderInvalid();
  preview = data;
  if (ME){
    const { data: planRow } = await sb.from('plans').select('*').eq('id', data.plan_id).maybeSingle();
    if (planRow){ saveTok(data.plan_id, token); await loadFull(planRow); return routeFull(); }
  }
  // ospite
  if (data.status === 'cancelled') return renderCancelled(data.title, data.organizer);
  if (data.status === 'confirmed') return renderConfirmedGuest();
  renderBallot({ guest:true });
}

async function loadById(id){
  if (!ME) return renderNeedLink();
  const { data: planRow } = await sb.from('plans').select('*').eq('id', id).maybeSingle();
  if (!planRow) return renderNeedLink();
  const { data: cands } = await sb.from('candidates').select('*').eq('plan_id', id);
  const { data: org } = await sb.from('actors').select('display_name').eq('id', planRow.organizer_id).maybeSingle();
  preview = { ok:true, plan_id:id, title:planRow.title, status:planRow.status, version:planRow.version,
    organizer: org ? org.display_name : '', voters:0, when_mode:planRow.when_mode, where_mode:planRow.where_mode,
    starts_at:planRow.starts_at, ends_at:planRow.ends_at, all_day:planRow.all_day, timezone:planRow.timezone,
    place_name:planRow.place_name, place_address:planRow.place_address, deadline_at:planRow.deadline_at,
    candidates: cands || [], people: [] };
  await loadFull(planRow);
  routeFull();
}

async function loadFull(planRow){
  const id = preview.plan_id;
  const candIds = preview.candidates.map(c => c.id);
  const [parts, ballots, results, changes, appr] = await Promise.all([
    sb.from('participants').select('actor_id, role, rsvp, actors(display_name)').eq('plan_id', id),
    sb.from('ballots').select('actor_id, field, none_ok, note, actors(display_name)').eq('plan_id', id),
    sb.from('v_candidate_results').select('candidate_id, field, approvals').eq('plan_id', id),
    sb.from('plan_changes').select('version, kind, new_value, note, created_at').eq('plan_id', id).order('version', { ascending:true }),
    candIds.length ? sb.from('approvals').select('candidate_id, actor_id').in('candidate_id', candIds) : Promise.resolve({ data: [] })
  ]);
  FULL = { plan: planRow, parts: parts.data || [], ballots: ballots.data || [], results: results.data || [],
           changes: changes.data || [], appr: appr.data || [] };
  FULL.meIsOrg = ME && planRow.organizer_id === ME.id;
  FULL.mePart = ME ? (FULL.parts.find(x => x.actor_id === ME.id) || null) : null;
  preview.voters = [...new Set(FULL.ballots.map(b => b.actor_id))].length;
}

function routeFull(){
  const st = preview.status;
  if (st === 'cancelled') return renderCancelled(preview.title, preview.organizer);
  if (st === 'confirmed') return renderConfirmedFull();
  if (FULL.meIsOrg) return renderOrg();
  // partecipante: scheda con voto precompilato
  sel.when.clear(); sel.where.clear();
  FULL.appr.filter(a => a.actor_id === ME.id).forEach(a => {
    const c = preview.candidates.find(x => x.id === a.candidate_id);
    if (c) sel[c.field].add(c.id);
  });
  renderBallot({ prefill:true });
}

/* ============================== SCHEDA DI VOTO ============================== */
function candRow(c, counts){
  const on = sel[c.field].has(c.id);
  const label = c.field === 'when' ? fmtWhen(c) : c.place_name;
  const s = c.field === 'where' ? (c.place_address || '') : '';
  const n = counts ? (counts.find(x => x.candidate_id === c.id) || { approvals:0 }).approvals : null;
  return `<button class="opt ${on ? 'on' : ''}" data-f="${c.field}" data-id="${c.id}">
    <span class="chk">${on ? '✓' : ''}</span>
    <span class="grow"><div class="t">${esc(label)}${n !== null ? ` · <span style="color:var(--green);font-weight:600">${n} ok</span>` : ''}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</span>
  </button>`;
}

// Unica verità su cosa si sta votando davvero: modalità 'deciding' E almeno
// un candidato da mostrare. Se le due cose si separano si finisce a mandare
// un ballot none_ok per una sezione che l'utente non ha mai visto.
const votable = f => preview[f + '_mode'] === 'deciding'
  && preview.candidates.some(c => c.field === f);

function renderBallot(o){
  o = o || {};
  const counts = o.prefill && FULL ? FULL.results : null;
  const cw = preview.candidates.filter(c => c.field === 'when');
  const cd = preview.candidates.filter(c => c.field === 'where');
  const askWhen = votable('when');
  const askWhere = votable('where');
  const people = o.guest ? (preview.people || []) : [];
  const myBallot = o.prefill && FULL ? FULL.ballots.find(b => b.actor_id === ME.id && b.note) : null;
  $('#app').innerHTML = `${o.guest ? '' : topbar()}
  <div class="card">
    <span class="mplate"><img src="${PENSA}" width="86" alt=""></span>
    <h1>${esc(preview.title)}</h1>
    <p class="sub">${t('{nome} chiede al gruppo', { nome: esc(preview.organizer) })} · ${t('{n} hanno già votato', { n: preview.voters })}</p>
    <span class="badge dec">${t('Ai voti')}</span>
    ${preview.deadline_at ? `<div class="sub" style="margin-top:8px">${t('Si chiude {quando}', { quando: fmtWhen({ starts_at: preview.deadline_at }) })}</div>` : ''}
  </div>
  ${askWhen ? `<div class="stitle">${t('Quando ti va bene? Segna tutte le opzioni ok')}</div><div class="group" id="g-when">${cw.map(c => candRow(c, counts)).join('')}</div>` : ''}
  ${preview.when_mode === 'fixed' && preview.starts_at ? `<div class="stitle">${t('Quando')}</div><div class="group"><div class="row"><b>${esc(fmtWhen(preview))}</b></div></div>` : ''}
  ${askWhere ? `<div class="stitle">${t('Dove ti va bene?')}</div><div class="group" id="g-where">${cd.map(c => candRow(c, counts)).join('')}</div>` : ''}
  ${preview.where_mode === 'fixed' && preview.place_name ? `<div class="stitle">Dove</div><div class="group"><div class="row"><b>${esc(preview.place_name)}</b>${preview.place_address ? ` · <span class="s">${esc(preview.place_address)}</span>` : ''}</div></div>` : ''}
  ${o.guest ? `<div class="stitle">${t('Chi sei?')}</div>
  <div class="group">
    ${people.length ? `<div class="chips" id="claims">${people.map(x => `<button class="chip" data-claim="${x.actor_id}">${esc(x.name)}</button>`).join('')}</div>` : ''}
    <div class="row"><input type="text" id="name" placeholder="${people.length ? t('Oppure scrivi il tuo nome') : t('Il tuo nome')}" maxlength="40" autocomplete="name"></div>
  </div>` : ''}
  <div class="stitle">${t('Nota per il gruppo · facoltativa')}</div>
  <div class="group"><div class="row"><textarea id="note" rows="2" maxlength="200" placeholder="${t('Es. per me va bene tutto, ma non troppo tardi')}">${esc(myBallot ? myBallot.note : '')}</textarea></div></div>
  <div class="err" id="err"></div>
  <button class="btn" id="send">${o.prefill && preview.voters && FULL.ballots.some(b => b.actor_id === ME.id) ? t('Aggiorna il mio voto') : t('Invia il mio voto')}</button>
  <p class="foot">${t(`Se non segni nulla vale come "nessuna opzione mi va bene". L'ultimo invio sostituisce il precedente.`)}</p>
  ${brand}`;

  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.f, id = b.dataset.id;
    sel[f].has(id) ? sel[f].delete(id) : sel[f].add(id);
    b.classList.toggle('on'); b.querySelector('.chk').textContent = sel[f].has(id) ? '✓' : '';
  }));
  document.querySelectorAll('#claims .chip').forEach(ch => ch.addEventListener('click', () => {
    const was = ch.classList.contains('on');
    document.querySelectorAll('#claims .chip').forEach(x => x.classList.remove('on'));
    claim = null;
    if (!was){ ch.classList.add('on'); claim = ch.dataset.claim; $('#name').value = ''; }
  }));
  const nm = $('#name');
  if (nm) nm.addEventListener('input', () => {
    if (nm.value.trim()){ claim = null; document.querySelectorAll('#claims .chip').forEach(x => x.classList.remove('on')); }
  });
  $('#send').addEventListener('click', () => submitVote(o));
}

async function submitVote(o){
  const nm = $('#name');
  const name = nm ? nm.value.trim() : '';
  if (o.guest && !name && !claim) return err(t('Dimmi chi sei: tocca il tuo nome o scrivilo.'));
  const btn = $('#send'); const btnLabel = btn.textContent;
  btn.disabled = true; btn.textContent = t('Invio…');
  try{
    await ensureSession();
    let planId = preview.plan_id;
    if (o.guest){
      const { data, error: je } = await sb.rpc('join_plan', { p_token: token, p_display_name: name || null, p_claim_actor: claim });
      if (je) throw je;
      planId = data; saveTok(planId, token);
    }
    const noteEl = $('#note');
    const note = noteEl ? (noteEl.value.trim() || null) : null;
    let noteUsed = false;
    for (const f of ['when', 'where']){
      if (!votable(f)) continue;
      const ids = [...sel[f]];
      const { error: se } = await sb.rpc('submit_ballot', { p_plan: planId, p_field: f, p_candidates: ids, p_none_ok: ids.length === 0, p_note: noteUsed ? null : note });
      if (se) throw se;
      noteUsed = true;
    }
    try{ await sb.rpc('log_event', { p_name:'vote_submitted', p_plan: planId, p_props:{} }); }catch(_){}
    renderDone(o);
  }catch(e){
    btn.disabled = false; btn.textContent = btnLabel;
    if (String(e && e.message).includes('claim not allowed')) err(t('Quel nome è già collegato a qualcun altro: scrivi il tuo.'));
    else anonErr(e, t('Non sono riuscito a registrare il voto.'));
  }
}

function renderDone(o){
  $('#app').innerHTML = `<div class="card">
    <span class="mplate"><img src="${PARTY}" width="120" alt=""></span>
    <div class="kimari">Votato ✓</div>
    <h1>${esc(preview.title)}</h1>
    <p class="sub">${t('Quando {nome} conferma, questa pagina mostrerà data e posto: salvala.', { nome: esc(preview.organizer) })}</p>
    <a class="btn sec" style="text-decoration:none" href="${location.href}">${t('Vedi il piano')}</a>
  </div>
  ${o && o.guest ? `<div class="stitle">${t('Avvisami quando è deciso')}</div>
  <div class="group"><div class="row" style="display:flex; gap:8px">
    <input type="email" id="email" placeholder="${t('La tua email (facoltativa)')}" inputmode="email" autocomplete="email">
    <button class="chip" id="saveEmail" style="flex:none">Ok</button>
  </div></div>
  <p class="foot">${t('Una sola email alla conferma, nessuna newsletter.')}</p>
  ${GBTN('Salva i tuoi piani con Google')}
  <div class="err" id="err"></div>` : ''}
  ${brand}`;
  const gb = $('#gbtn'); if (gb) gb.addEventListener('click', googleAuth);
  const se = $('#saveEmail');
  if (se) se.addEventListener('click', async () => {
    const v = $('#email').value.trim(); if (!v) return;
    try{ await sb.rpc('set_my_email', { p_email: v }); se.textContent = '✓'; }catch(_){}
  });
}

/* ============================== ORGANIZZATORE (ai voti) ============================== */
const chosen = { when: null, where: null };
function nameOfActor(a){ const p = FULL.parts.find(x => x.actor_id === a); return p && p.actors ? p.actors.display_name : '?'; }

function orgCandRow(c){
  const r = FULL.results.find(x => x.candidate_id === c.id);
  const n = r ? r.approvals : 0;
  const who = FULL.appr.filter(a => a.candidate_id === c.id).map(a => nameOfActor(a.actor_id));
  const tot = Math.max(1, FULL.parts.length);
  const on = chosen[c.field] === c.id;
  const label = c.field === 'when' ? fmtWhen(c) : c.place_name;
  return `<button class="opt ${on ? 'on' : ''}" data-of="${c.field}" data-oid="${c.id}">
    <span class="chk">${on ? '✓' : ''}</span>
    <span class="grow"><div class="t">${esc(label)} · <span style="color:var(--green)">${n} ok</span></div>
      ${who.length ? `<div class="s">${esc(who.join(', '))}</div>` : `<div class="s">${t('nessuno ancora')}</div>`}
      <div style="height:5px;border-radius:3px;background:var(--fill);margin-top:6px"><div style="height:5px;border-radius:3px;background:var(--green);width:${Math.round(n / tot * 100)}%"></div></div>
    </span></button>`;
}

function renderOrg(){
  const cw = preview.candidates.filter(c => c.field === 'when');
  const cd = preview.candidates.filter(c => c.field === 'where');
  const askWhen = preview.when_mode === 'deciding';
  const askWhere = preview.where_mode === 'deciding';
  const votedIds = [...new Set(FULL.ballots.map(b => b.actor_id))];
  const missing = FULL.parts.filter(p => p.role !== 'organizer' && !votedIds.includes(p.actor_id)).map(p => p.actors ? p.actors.display_name : '?');
  const noneOk = f => FULL.ballots.filter(b => b.field === f && b.none_ok).map(b => b.actors ? b.actors.display_name : '?');
  const notes = FULL.ballots.filter(b => b.note).map(b => `${b.actors ? b.actors.display_name : '?'}: ${b.note}`);

  $('#app').innerHTML = `${topbar(`<a href="#" id="orgvote">${t('Vota anche tu')}</a>`)}

    <span class="mplate"><img src="${PENSA}" width="86" alt=""></span>
    <h1>${esc(preview.title)}</h1>
    <p class="sub">Sei l'organizzatore · ${votedIds.length} su ${FULL.parts.length} hanno votato</p>
    <span class="badge dec">${t('Ai voti')}</span>

  ${askWhen ? `<div class="stitle">${t('Quando — tocca l\'opzione da confermare')}</div>
  <div class="group">${cw.map(orgCandRow).join('')}</div>
  ${noneOk('when').length ? `<p class="fnote">${t('A {chi} non va bene nessuna data.', { chi: esc(noneOk('when').join(', ')) })}</p>` : ''}

    <input type="datetime-local" id="add-when"><button class="chip" id="btn-add-when" style="flex:none">Aggiungi</button></div></div>` : ''}
  ${askWhere ? `<div class="stitle">${t('Dove — tocca l\'opzione da confermare')}</div>
  <div class="group">${cd.map(orgCandRow).join('')}</div>
  ${noneOk('where').length ? `<p class="fnote">${t('A {chi} non va bene nessun posto.', { chi: esc(noneOk('where').join(', ')) })}</p>` : ''}
  <div class="group" style="margin-top:8px"><div class="row" style="display:flex;gap:8px">
    <input type="text" id="add-where" placeholder="${t('Nuovo posto')}" maxlength="60"><button class="chip" id="btn-add-where" style="flex:none">Aggiungi</button></div></div>` : ''}
  ${missing.length ? `<div class="stitle">${t('Non hanno ancora votato')}</div><div class="group"><div class="row">${esc(missing.join(', '))}</div></div>` : ''}
  ${notes.length ? `<div class="stitle">${t('Note del gruppo')}</div><div class="group">${notes.map(n => `<div class="row" style="font-size:14px">${esc(n)}</div>`).join('')}</div>` : ''}
  <div class="err" id="err"></div>
  <button class="btn" id="confirm">${t('Conferma il piano')}</button>
  <button class="btn sec" id="share">${t('Rimanda il link al gruppo')}</button>
  <p class="foot">${t('Conferma quando ti basta: il link resta lo stesso e diventa la pagina dell\'evento.')}</p>
  ${brand}`;

  $('#orgvote').addEventListener('click', (e) => {
    e.preventDefault();
    sel.when.clear(); sel.where.clear();
    FULL.appr.filter(a => a.actor_id === ME.id).forEach(a => { const c = preview.candidates.find(x => x.id === a.candidate_id); if (c) sel[c.field].add(c.id); });
    renderBallot({ prefill:true });
  });
  document.querySelectorAll('[data-oid]').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.of;
    chosen[f] = chosen[f] === b.dataset.oid ? null : b.dataset.oid;
    renderOrg();
  }));
  const addFn = async (field, item) => {
    try{
      const { error } = await sb.rpc('add_candidates', { p_plan: preview.plan_id, p_field: field, p_items: [item] });
      if (error) throw error;
      location.reload();
    }catch(e){
      const m = String(e && e.message || '');
      if (m.includes('add_candidates')) err('Manca la funzione add_candidates: esegui il file SQL del pacchetto nel SQL Editor.');
      else if (m.includes('max 5')) err('Massimo 5 opzioni per campo.');
      else err('Non riesco ad aggiungere: ' + m);
    }
  };
  const bw = $('#btn-add-when');
  if (bw) bw.addEventListener('click', () => { const v = $('#add-when').value; if (v) addFn('when', { starts_at: new Date(v).toISOString(), timezone: Intl.DateTimeFormat().resolvedOptions().timeZone }); });
  const bd = $('#btn-add-where');
  if (bd) bd.addEventListener('click', () => { const v = $('#add-where').value.trim(); if (v) addFn('where', { place_name: v }); });
  $('#share').addEventListener('click', () => { location.href = 'https://wa.me/?text=' + encodeURIComponent(`${preview.title} — vota qui: ${link}`); });
  $('#confirm').addEventListener('click', async () => {
    if (askWhen && !chosen.when) return err('Tocca la data da confermare.');
    if (askWhere && !chosen.where) return err('Tocca il posto da confermare (o aggiungilo).');
    const b = $('#confirm'); b.disabled = true; b.textContent = 'Confermo…';
    try{
      const { error } = await sb.rpc('confirm_plan', { p_plan: preview.plan_id, p_when: chosen.when, p_where: chosen.where });
      if (error) throw error;
      try{ await sb.rpc('log_event', { p_name:'plan_confirmed', p_plan: preview.plan_id, p_props:{} }); }catch(_){}
      location.reload();
    }catch(e){ b.disabled = false; b.textContent = 'Conferma il piano'; err('Errore in conferma: ' + ((e && e.message) || '')); }
  });
}

/* ============================== CONFERMATO ============================== */
function icsHref(){
  const dt = x => new Date(x).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const start = preview.starts_at; if (!start) return null;
  const end = preview.ends_at || new Date(new Date(start).getTime() + 2 * 3600e3).toISOString();
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Kimari//IT', 'BEGIN:VEVENT',
    'UID:' + preview.plan_id + '@kimari', 'DTSTAMP:' + dt(new Date().toISOString()),
    'DTSTART:' + dt(start), 'DTEND:' + dt(end),
    'SUMMARY:' + preview.title.replace(/[,;]/g, ' '),
    preview.place_name ? 'LOCATION:' + (preview.place_name + (preview.place_address ? ' ' + preview.place_address : '')).replace(/[,;]/g, ' ') : '',
    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}
function confirmedHead(){
  const maps = preview.place_name ? `https://maps.google.com/?q=${encodeURIComponent((preview.place_name || '') + ' ' + (preview.place_address || ''))}` : null;
  return `<div class="card">
    <span class="mplate"><img src="${PARTY}" width="120" alt=""></span>
    <div class="kimari">Kimari!</div>
    <h1>${esc(preview.title)}</h1>
    ${preview.starts_at ? `<div class="when-big">${esc(fmtWhen(preview))}</div>` : ''}
    ${preview.place_name ? `<div class="where-big">${esc(preview.place_name)}${preview.place_address ? ` · <a href="${maps}">${esc(preview.place_address)}</a>` : ''}</div>` : `<div class="where-big" style="color:var(--sec)">${t('Posto: si decide')}</div>`}
    <span class="badge ok">${t('Confermato')}</span><span class="badge gray">v${preview.version}</span>
    <p class="sub" style="margin-top:10px">Organizza ${esc(preview.organizer)}</p>
    ${icsHref() ? `<a class="btn sec" style="text-decoration:none" href="${icsHref()}" download="kimari-${(preview.title || 'evento').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.ics">Aggiungi al calendario</a>` : ''}
  </div>`;
}
function renderConfirmedGuest(){
  const people = preview.people || [];
  $('#app').innerHTML = `${confirmedHead()}
  <div class="stitle">Ci sei?</div>
  <div class="group">
    ${people.length ? `<div class="chips" id="claims">${people.map(x => `<button class="chip" data-claim="${x.actor_id}">${esc(x.name)}</button>`).join('')}</div>` : ''}
    <div class="row"><input type="text" id="name" placeholder="${people.length ? 'Oppure scrivi il tuo nome' : 'Il tuo nome'}" maxlength="40"></div>
    <div class="row"><div class="rseg">
      <button class="yes" data-r="yes">${t('Ci sono')}</button><button class="maybe" data-r="maybe">Forse</button><button class="no" data-r="no">${t('Non vengo')}</button>
    </div></div>
  </div>
  <div class="err" id="err"></div>
  ${brand}`;
  document.querySelectorAll('#claims .chip').forEach(ch => ch.addEventListener('click', () => {
    const was = ch.classList.contains('on');
    document.querySelectorAll('#claims .chip').forEach(x => x.classList.remove('on'));
    claim = null; if (!was){ ch.classList.add('on'); claim = ch.dataset.claim; $('#name').value = ''; }
  }));
  document.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', async () => {
    const name = $('#name').value.trim();
    if (!name && !claim) return err(t('Dimmi chi sei: tocca il tuo nome o scrivilo.'));
    try{
      await ensureSession();
      const { data: planId, error: je } = await sb.rpc('join_plan', { p_token: token, p_display_name: name || null, p_claim_actor: claim });
      if (je) throw je;
      saveTok(planId, token);
      const { error } = await sb.rpc('set_rsvp', { p_plan: planId, p_rsvp: b.dataset.r });
      if (error) throw error;
      location.reload();
    }catch(e){
      if (String(e && e.message).includes('claim not allowed')) err(t('Quel nome è già collegato a qualcun altro: scrivi il tuo.'));
      else anonErr(e, 'Non riesco a salvare.');
    }
  }));
}
function renderConfirmedFull(){
  const groups = { yes:[], maybe:[], no:[], none:[] };
  FULL.parts.forEach(p => { groups[p.rsvp || 'none'].push(p.actors ? p.actors.display_name : '?'); });
  const my = FULL.mePart ? FULL.mePart.rsvp : null;
  const kindTxt = { created:'Creato', confirmed:'Confermato', when_changed:'Data cambiata', where_changed:'Posto cambiato', cancelled:'Annullato' };
  $('#app').innerHTML = `${topbar(FULL.meIsOrg ? '<a href="#" id="orgtools">Modifica</a>' : '')}
  ${confirmedHead()}
  ${FULL.mePart ? `<div class="stitle">Ci sei?</div>
  <div class="group"><div class="row"><div class="rseg">
    <button class="yes ${my === 'yes' ? 'on' : ''}" data-r="yes">${t('Ci sono')}</button>
    <button class="maybe ${my === 'maybe' ? 'on' : ''}" data-r="maybe">Forse</button>
    <button class="no ${my === 'no' ? 'on' : ''}" data-r="no">${t('Non vengo')}</button>
  </div></div></div>` : ''}
  ${groups.yes.length ? `<div class="stitle">${t('Ci sono · {n}', { n: groups.yes.length })}</div><div class="group"><div class="row">${esc(groups.yes.join(', '))}</div></div>` : ''}
  ${groups.maybe.length ? `<div class="stitle">Forse · ${groups.maybe.length}</div><div class="group"><div class="row">${esc(groups.maybe.join(', '))}</div></div>` : ''}
  ${groups.no.length ? `<div class="stitle">${t('Non vengono · {n}', { n: groups.no.length })}</div><div class="group"><div class="row">${esc(groups.no.join(', '))}</div></div>` : ''}
  ${groups.none.length ? `<div class="stitle">${t('Non hanno risposto · {n}', { n: groups.none.length })}</div><div class="group"><div class="row">${esc(groups.none.join(', '))}</div></div>` : ''}
  ${FULL.changes.length > 1 ? `<div class="stitle">Storia</div><div class="group">${FULL.changes.map(ch => `<div class="row" style="font-size:14px"><b>v${ch.version}</b> · ${kindTxt[ch.kind] || ch.kind}${ch.note ? ` · <span class="s">${esc(ch.note)}</span>` : ''}</div>`).join('')}</div>` : ''}
  <div id="tools"></div>
  <div class="err" id="err"></div>
  ${brand}`;
  document.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', async () => {
    try{ const { error } = await sb.rpc('set_rsvp', { p_plan: preview.plan_id, p_rsvp: b.dataset.r }); if (error) throw error; location.reload(); }
    catch(e){ err('Non riesco a salvare: ' + ((e && e.message) || '')); }
  }));
  const ot = $('#orgtools');
  if (ot) ot.addEventListener('click', (e) => {
    e.preventDefault();
    $('#tools').innerHTML = `
    <div class="stitle">${t('Sposta la data')}</div>
    <div class="group"><div class="row" style="display:flex;gap:8px">
      <input type="datetime-local" id="nw"><button class="chip" id="nw-go" style="flex:none">${t('Salva')}</button></div></div>
    <div class="stitle">${t('Cambia posto')}</div>
    <div class="group">
      <div class="row"><input type="text" id="np" placeholder="${t('Nome del posto')}" maxlength="60"></div>
      <div class="row" style="display:flex;gap:8px"><input type="text" id="npa" placeholder="Indirizzo (facoltativo)" maxlength="80"><button class="chip" id="np-go" style="flex:none">${t('Salva')}</button></div></div>
    <p class="fnote">${t(`Ogni modifica alza la versione (v{a} → v{b}) e resta nella storia: chi ha il link vede sempre l'ultima.`, { a: preview.version, b: preview.version + 1 })}</p>
    <button class="btn danger" id="cancelp">${t('Annulla il piano')}</button>`;
    $('#nw-go').addEventListener('click', async () => {
      const v = $('#nw').value; if (!v) return;
      try{
        const { error } = await sb.rpc('update_plan_field', { p_plan: preview.plan_id, p_field:'when',
          p_value:{ starts_at:new Date(v).toISOString(), timezone: Intl.DateTimeFormat().resolvedOptions().timeZone }, p_note:null });
        if (error) throw error; location.reload();
      }catch(e2){ err('Errore: ' + ((e2 && e2.message) || '')); }
    });
    $('#np-go').addEventListener('click', async () => {
      const n = $('#np').value.trim(); if (!n) return;
      try{
        const { error } = await sb.rpc('update_plan_field', { p_plan: preview.plan_id, p_field:'where',
          p_value:{ place_name:n, place_address: $('#npa').value.trim() || null }, p_note:null });
        if (error) throw error; location.reload();
      }catch(e2){ err('Errore: ' + ((e2 && e2.message) || '')); }
    });
    $('#cancelp').addEventListener('click', async () => {
      if (!confirm('Annullo il piano per tutti?')) return;
      try{ const { error } = await sb.rpc('cancel_plan', { p_plan: preview.plan_id, p_note:null }); if (error) throw error; location.reload(); }
      catch(e2){ err('Errore: ' + ((e2 && e2.message) || '')); }
    });
  });
}

/* ============================== STATI SEMPLICI ============================== */
function renderInvalid(){
  $('#app').innerHTML = `<div class="card">
    <span class="mplate"><img src="${PENSA}" width="86" alt=""></span>
    <h1>${t('Link non valido')}</h1>
    <p class="sub">L'invito è scaduto o è stato revocato. Chiedi all'organizzatore un link nuovo.</p>
  </div>${brand}`;
}
function renderCancelled(title, org){
  $('#app').innerHTML = `${topbar()}<div class="card"><h1>${esc(title)}</h1>
    <p class="sub">${org ? t('Questo piano è stato annullato da {chi}.', { chi: esc(org) }) : t('Questo piano è stato annullato.')}</p></div>${brand}`;
}
function renderNeedLink(){
  $('#app').innerHTML = `${topbar()}<div class="card"><h1>${t('Serve il link d’invito')}</h1>
    <p class="sub">${t('Questo piano si apre dal suo link (quello che gira su WhatsApp): da questo telefono non risulti dentro.')}</p></div>${brand}`;
}
