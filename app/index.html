      if(d.step < 4){ d.step++; render(); break; }
      const np = createPlan(d); state.draft = null; state.justVoted = false; state.ballotDraft = null; state.bdKey = null; go(`share/${np.id}`); break;
    }
    case 'repeatPlan': { const nd = newDraft(p.groupId || ''); nd.title = p.title; nd.emoji = p.emoji; if(p.where.value && p.where.value.name){ nd.whereMode = 'fixed'; nd.whereFixed = { ...p.where.value }; } state.newFrom = location.hash; state.draft = nd; go('new'); break; }

    /* condivisione / ospite */
    case 'copy': copy(el.dataset.text); break;
    case 'share': condividi(el.dataset.text); break;
    case 'asGuest': state.me = 'guest'; state.justVoted = false; state.ballotDraft = null; state.bdKey = null; go(`i/${state.plans[el.dataset.plan].token}`); break;
    case 'guestTap': state.pendingTap = el.dataset.field === 'rsvp' ? { rsvp:['Ci sono','Forse','Non vengo'].indexOf(el.textContent.trim()) } : { field:el.dataset.field, id:el.dataset.id }; openSheet(sheetName(p)); break;
    case 'claim': joinPlan(p, '', el.dataset.id); closeSheet(); afterJoin(p); break;
    case 'join': { const name = $('#nameInput').value.trim(); if(!name){ toast('Scrivi il tuo nome'); break; } joinPlan(p, name); closeSheet(); afterJoin(p); break; }

    /* voto */
    case 'tog': { const bd = ensureBallotDraft(p); const f = el.dataset.field; const s = bd[f].approved; s.has(el.dataset.id) ? s.delete(el.dataset.id) : s.add(el.dataset.id); bd[f].noneOk = false; render(); break; }
    case 'ynVote': {
      const bd = ensureBallotDraft(p); const f = el.dataset.field; bd[f].approved = new Set([el.dataset.id]); bd[f].noneOk = false;
      if(p.kind === 'decision'){ const first = !p.ballots[state.me]; p.ballots[state.me] = { at:Date.now(), [f]:{ approved:[el.dataset.id], noneOk:false, note:'' } }; state.justVoted = true; toast(first ? 'Voto registrato' : t('Voto cambiato')); }
      render(); break;
    }
    case 'none': { const bd = ensureBallotDraft(p); const f = el.dataset.field; bd[f].noneOk = !bd[f].noneOk; if(bd[f].noneOk) bd[f].approved.clear(); render(); break; }
    case 'vote': {
      const bd = ensureBallotDraft(p);
      for(const f of decidingFields(p)){ if(!bd[f].approved.size && !bd[f].noneOk){ toast(`Segna almeno un'opzione per "${fieldLabel(p, f)}"`); return; } }
      const b = { at:Date.now() }; decidingFields(p).forEach(f => { b[f] = { approved:[...bd[f].approved], noneOk:bd[f].noneOk, note:bd[f].note }; });
      const first = !p.ballots[state.me]; p.ballots[state.me] = b; state.justVoted = true; toast(first ? 'Voto inviato' : t('Voto aggiornato')); render(); break;
    }
    case 'email': { const v = $('#emailInput').value.trim(); if(!v.includes('@')){ toast('Controlla l\'email'); break; } me().email = v.toLowerCase(); toast('Ti avvisiamo alla conferma'); break; }
    case 'simulate': { const sp = state.plans[el.dataset.plan]; if(sp.groupId) simulateGroupVotes(sp); else simulateFriends(sp); toast(t('Hanno votato tutti')); render(); break; }
    case 'proposeCand': openSheet(sheetProposeCand(p, el.dataset.field)); break;
    case 'saveCand': {
      const f = el.dataset.field; const fo = fieldObj(p, f); let c;
      if(f === 'when'){ const st = $('#pcStart').value; if(!st){ toast('Scegli una data'); break; } if(fo.candidates.some(x => x.start === st)){ toast(t('Già tra le opzioni')); break; } c = { id:uid(), start:st, end:$('#pcEnd').value, allDay:$('#pcAllDay').classList.contains('on'), proposedBy:state.me }; }
      else { const n = $('#pcName').value.trim(); if(!n){ toast("Scrivi l'opzione"); break; } if(fo.candidates.some(x => x.name.toLowerCase() === n.toLowerCase())){ toast(t('Già tra le opzioni')); break; } c = { id:uid(), name:n, address: f === 'where' ? $('#pcAddr').value.trim() : undefined, proposedBy:state.me }; }
      if(fo.candidates.length >= 5){ toast('Massimo 5 opzioni'); break; }
      fo.candidates.push(c); const bd = ensureBallotDraft(p); bd[f].approved.add(c.id); bd[f].noneOk = false;
      sysComment(p, 'candidate', `${nameOf(state.me)} ha proposto ${candText(f, c)}`); closeSheet(); toast('Opzione aggiunta: invia il voto per confermarla'); render(); break;
    }
    case 'toggleAllow': p.allowProposals = !p.allowProposals; render(); break;
    case 'joinPolicy': openSheet(sheetJoinPolicy(p)); break;
    case 'toggleBooked': p.booked = !p.booked; sysComment(p, 'proposal', p.booked ? `${nameOf(state.me)} ha prenotato: le proposte le applica lui` : `${nameOf(state.me)} ha tolto "ho prenotato": le proposte passano da sole con la maggioranza`); render(); break;

    /* imprevisti */
    case 'lateSheet': state.lateMin = 20; state.lateNote = ''; openSheet(sheetLate()); break;
    case 'lateMin': state.lateMin = +el.dataset.v; state.lateNote = ($('#lateNote') || { value:'' }).value; openSheet(sheetLate()); break;
    case 'saveLate': { const m = p.participants.find(x => x.id === state.me); const note = $('#lateNote').value.trim(); m.late = { minutes:state.lateMin, note, at:Date.now() }; if(m.rsvp !== 'yes'){ m.rsvp = 'yes'; m.rsvpAt = Date.now(); } const t = `⏰ ${nameOf(state.me)} arriva in ritardo${state.lateMin ? ` (${state.lateMin} min)` : ''}${note ? ` · “${note}”` : ''}`; sysComment(p, 'late', t); closeSheet(); render(); msgSheet(t('Avvisato in app'), t(t(t(t('Se vuoi, mandalo anche su WhatsApp.')))), `${t} a ${p.title} 👉 ${linkOf(p)}`, p, 'Aggiornamento'); break; }
    case 'clearLate': { const m = p.participants.find(x => x.id === state.me); m.late = null; sysComment(p, 'late', `${nameOf(state.me)} non è più in ritardo`); toast('Ritardo annullato'); render(); break; }
    case 'absentSheet': openSheet(sheetAbsent()); break;
    case 'saveAbsent': { const m = p.participants.find(x => x.id === state.me); const note = $('#absentNote').value.trim(); m.rsvp = 'no'; m.rsvpAt = Date.now(); m.late = null; const t = `🙁 ${nameOf(state.me)} non può più venire${note ? ` · “${note}”` : ''}`; sysComment(p, 'absent', t); closeSheet(); render(); msgSheet('Avvisato in app', t('Se vuoi, mandalo anche su WhatsApp.'), `${t} a ${p.title} 👉 ${linkOf(p)}`, p, 'Aggiornamento'); break; }

    /* organizzatore: conferma, modifica */
    case 'nudge': msgSheet(t('Sollecita chi manca'), t('Un messaggio pronto, con i nomi di chi non ha ancora votato.'), msgs.nudge(p, missingIds(p).map(id => nameOf(id))), p, 'Vota qui · non serve installare niente'); break;
    case 'openConfirm': openSheet(sheetConfirm(p, true)); break;
    case 'pick': state.picks[el.dataset.field] = el.dataset.id; openSheet(sheetConfirm(p, false)); break;
    case 'confirm': confirmPlan(p, state.picks); closeSheet(); render(); setTimeout(() => msgSheet(p.kind === 'decision' ? 'Kimari! Deciso' : t('Kimari! Piano confermato'), t('Manda il risultato nel gruppo: il link è lo stesso, ora mostra la versione definitiva.'), msgs.confirm(p), p, p.kind === 'decision' ? 'Deciso' : 'Confermato'), 450); break;
    case 'openEdit': openSheet(sheetEdit(p)); break;
    case 'swLocal': el.classList.toggle('on'); break;
    case 'saveEdit': {
      const when = { start:$('#editStart').value, end:$('#editEnd').value, allDay:$('#editAllDay').classList.contains('on') }; const where = { name:$('#editPlace').value.trim(), address:$('#editAddr').value.trim() };
      const ch = editPlan(p, when, where); closeSheet(); if(!ch.length){ toast('Nessuna modifica'); break; }
      render(); setTimeout(() => msgSheet(`Versione ${p.version}`, t('Avvisa il gruppo: chi apre il link vede già il piano aggiornato.'), msgs.change(p, ch), p, 'Piano aggiornato'), 300); break;
    }
    case 'rsvp': { const m = p.participants.find(x => x.id === state.me); if(m){ m.rsvp = el.dataset.v; m.rsvpAt = Date.now(); if(m.rsvp === 'no') m.late = null; render(); } break; }
    case 'ics': downloadIcs(p); break;

    /* proposte di cambio */
    case 'proposeChange': state.prField = openProposalFor(p, 'when') && !openProposalFor(p, 'where') ? 'where' : 'when'; openSheet(sheetPropose(p)); break;
    case 'prField': state.prField = el.dataset.v; openSheet(sheetPropose(p)); break;
    case 'savePropose': {
      const f = el.dataset.field; let nv; const reason = $('#prReason').value.trim();
      if(f === 'when'){ const st = $('#prStart').value; if(!st){ toast('Scegli data e ora'); break; } nv = { start:st, end:$('#prEnd').value, allDay:$('#prAllDay').classList.contains('on') }; if(nv.start === p.when.value.start && (nv.end || '') === (p.when.value.end || '') && nv.allDay === !!p.when.value.allDay){ toast(t('È lo stesso orario di adesso')); break; } }
      else { const n = $('#prName').value.trim(); if(!n){ toast('Scrivi il nome del posto'); break; } nv = { name:n, address:$('#prAddr').value.trim() }; }
      const pr = openProposal(p, f, nv, reason); const t = prTexts(p, pr); closeSheet(); render();
      msgSheet('Proposta aperta', t('Il gruppo la vede nel piano. Se vuoi, mandala anche su WhatsApp.'), `🔁 ${nameOf(state.me)} propone per ${p.title}: ${t.label} ${t.newText} (era ${t.oldText})${reason ? ' · “' + reason + '”' : ''}. Sì o no? 👉 ${linkOf(p)}`, p, t('Proposta di modifica')); break;
    }
    case 'pvote': { const pr = p.proposals.find(x => x.id === el.dataset.pr); if(!pr || (pr.status !== 'open' && pr.status !== 'ready')) break; const ch = voteProposal(p, pr, el.dataset.v); render(); if(pr.status === 'approved'){ toast(t('Proposta approvata: piano aggiornato')); if(ch && ch.length) setTimeout(() => msgSheet(`Versione ${p.version}`, t('La proposta è passata: chi apre il link vede già il piano aggiornato.'), msgs.change(p, ch), p, 'Piano aggiornato'), 300); } else if(pr.status === 'ready') toast(`Maggioranza raggiunta: decide ${nameOf(p.organizer)}`); break; }
    case 'papply': { const pr = p.proposals.find(x => x.id === el.dataset.pr); const ch = applyProposal(p, pr, state.me); render(); if(ch && ch.length) setTimeout(() => msgSheet(`Versione ${p.version}`, t('Hai applicato la proposta: avvisa il gruppo.'), msgs.change(p, ch), p, 'Piano aggiornato'), 300); break; }
    case 'preject': { const pr = p.proposals.find(x => x.id === el.dataset.pr); rejectProposal(p, pr, state.me); toast('Proposta rifiutata'); render(); break; }
    case 'pwithdraw': { const pr = p.proposals.find(x => x.id === el.dataset.pr); pr.status = 'withdrawn'; pr.closedAt = Date.now(); sysComment(p, 'proposal_no', `${nameOf(state.me)} ha ritirato la proposta`); toast('Proposta ritirata'); render(); break; }

    /* commenti, allegati, foto */
    case 'comment': { const v = $('#commentInput').value.trim(); if(!v) break; p.comments.push({ id:uid(), by:state.me, at:Date.now(), text:v, system:false }); render(); break; }
    case 'delComment': { const c = p.comments.find(x => x.id === el.dataset.id); if(!c || !(canModerate(p) || c.by === state.me)) break; p.comments = p.comments.filter(x => x.id !== el.dataset.id); if(c.by !== state.me) sysComment(p, 'mod', `${nameOf(state.me)} ha rimosso un commento di ${nameOf(c.by)}`); render(); break; }
    case 'addPhoto': $('#photoInput').click(); break;
    case 'addFile': $('#fileInput').click(); break;
    case 'addLink': openSheet(sheetLink()); break;
    case 'saveLink': { let u = $('#lkUrl').value.trim(); if(!u){ toast('Incolla un link'); break; } if(!/^https?:\/\//i.test(u)) u = 'https://' + u; const n = $('#lkName').value.trim() || u.replace(/^https?:\/\//, '').split('/')[0]; const mt = state.mediaTarget; if(mt && mt.kind === 'place'){ const pl = me().places.find(x => x.id === mt.id); pl.files.push({ id:uid(), name:n, url:u, at:Date.now() }); state.mediaTarget = null; openSheet(sheetPlace(pl)); } else { p.files.push({ id:uid(), name:n, url:u, by:state.me, at:Date.now() }); sysComment(p, 'photo', `${nameOf(state.me)} ha aggiunto il link ${n}`); closeSheet(); render(); } toast('Link aggiunto'); break; }
    case 'delFile': { const f = p.files.find(x => x.id === el.dataset.id); if(!f || !(canModerate(p) || f.by === state.me)) break; p.files = p.files.filter(x => x.id !== el.dataset.id); render(); break; }
    case 'lightbox': { const ph = p.photos.find(x => x.id === el.dataset.id); if(ph){ $('#lightbox').innerHTML = `<img src="${ph.dataUrl}" alt="">`; $('#lightbox').classList.add('show'); } break; }
    case 'closeLightbox': $('#lightbox').classList.remove('show'); break;

    /* spese */
    case 'addExpense': state.edraft = { desc:'', amount:'', payer:state.me, among:'yes', picked:new Set() }; openSheet(sheetExpense(p)); break;
    case 'exPayer': state.edraft.payer = el.dataset.v; openSheet(sheetExpense(p)); break;
    case 'exAmong': state.edraft.among = el.dataset.v; openSheet(sheetExpense(p)); break;
    case 'exPick': { const pk = state.edraft.picked; pk.has(el.dataset.v) ? pk.delete(el.dataset.v) : pk.add(el.dataset.v); openSheet(sheetExpense(p)); break; }
    case 'saveExpense': {
      const ed = state.edraft; const amt = parseEur(ed.amount); if(!ed.desc.trim()){ toast('Scrivi cosa hai pagato'); break; } if(!amt || amt <= 0){ toast('Importo non valido'); break; }
      let among;
      if(ed.among === 'pick'){ among = [...ed.picked]; if(!among.length){ toast('Scegli per chi è la spesa'); break; } }
      else { among = ed.among === 'yes' ? p.participants.filter(x => x.rsvp === 'yes').map(x => x.id) : p.participants.map(x => x.id); if(!among.includes(ed.payer)) among = [ed.payer, ...among]; if(among.length < 2 && ed.among === 'yes') among = p.participants.map(x => x.id); }
      p.expenses.push({ id:uid(), desc:ed.desc.trim(), amount:amt, by:ed.payer, among, at:Date.now(), voided:false }); sysComment(p, 'expense', `${nameOf(ed.payer)} ha pagato ${fmtEur(amt)} · ${ed.desc.trim()}${ed.among === 'pick' ? ' (' + t('per {chi}', { chi: among.map(id => id === ed.payer ? t('sé') : nameOf(id)).join(', ') }) + ')' : ''}`); closeSheet(); state.edraft = null; toast(t('Spesa registrata')); render(); break;
    }
    case 'voidExpense': { const ex = p.expenses.find(x => x.id === el.dataset.id); if(!ex) break; ex.voided = true; sysComment(p, 'expense', `${nameOf(state.me)} ha annullato la spesa "${ex.desc}" (${fmtEur(ex.amount)})`); toast('Spesa annullata'); render(); break; }
    case 'settle': { const s = { id:uid(), from:el.dataset.from, to:el.dataset.to, amount:+el.dataset.amount, at:Date.now(), by:state.me }; p.settlements.push(s); sysComment(p, 'expense', `💸 ${nameOf(s.from)} ha pagato ${fmtEur(s.amount)} a ${nameOf(s.to)}`); toast('Pagamento registrato'); render(); break; }

    /* posti salvati */
    case 'savePlaceDraft': { const pl = savePlace(d.whereFixed.name, d.whereFixed.address); if(pl) toast('Salvato tra i tuoi posti ★'); render(); break; }
    case 'savePlaceFromPlan': { const pl = savePlace(p.where.value.name, p.where.value.address); if(pl){ pl.used += 1; if(p.where.value.photo) pl.photos.push({ id:uid(), dataUrl:p.where.value.photo, name:t('Dal piano') }); toast('Salvato tra i tuoi posti ★'); } render(); break; }
    case 'newPlace': { const pl = { id:uid(), name:'', address:'', note:'', photos:[], files:[], createdAt:Date.now(), used:0 }; me().places.push(pl); state.placeId = pl.id; openSheet(sheetPlace(pl)); break; }
    case 'openPlace': { state.placeId = el.dataset.id; openSheet(sheetPlace(me().places.find(x => x.id === el.dataset.id))); break; }
    case 'delPlace': { me().places = me().places.filter(x => x.id !== el.dataset.id); state.placeId = null; closeSheet(); toast(t('Posto eliminato')); render(); break; }
    case 'plDelFile': { const pl = me().places.find(x => x.id === el.dataset.pl); pl.files = pl.files.filter(x => x.id !== el.dataset.id); openSheet(sheetPlace(pl)); break; }
    case 'plAddPhoto': state.mediaTarget = { kind:'place', id:el.dataset.pl }; $('#photoInput').click(); break;
    case 'plAddFile': state.mediaTarget = { kind:'place', id:el.dataset.pl }; $('#fileInput').click(); break;
    case 'plAddLink': state.mediaTarget = { kind:'place', id:el.dataset.pl }; openSheet(sheetLink()); break;
    case 'plCover': { const pl = me().places.find(x => x.id === el.dataset.pl); const i = pl.photos.findIndex(x => x.id === el.dataset.id); if(i > 0){ const [ph] = pl.photos.splice(i, 1); pl.photos.unshift(ph); toast('Copertina aggiornata'); } openSheet(sheetPlace(pl)); break; }
    case 'plDelPhoto': { const pl = me().places.find(x => x.id === el.dataset.pl); pl.photos = pl.photos.filter(x => x.id !== el.dataset.id); openSheet(sheetPlace(pl)); break; }
    case 'plLightbox': { const pl = me().places.find(x => x.id === el.dataset.pl); const ph = pl && pl.photos.find(x => x.id === el.dataset.id); if(ph){ $('#lightbox').innerHTML = `<img src="${ph.dataUrl}" alt="">`; $('#lightbox').classList.add('show'); } break; }
    case 'fillPlace': { const t = el.dataset.t; const nEl = $('#' + t + 'Name'), aEl = $('#' + t + 'Addr'); if(nEl) nEl.value = el.dataset.name; if(aEl) aEl.value = el.dataset.address; break; }

    /* profilo */
    case 'push': state.settings.push[el.dataset.k] = !state.settings.push[el.dataset.k]; render(); break;
    case 'toggleUnlimited': me().unlimited = !me().unlimited; toast(me().unlimited ? t('Unlimited attivo (demo, non si paga)') : t('Tornato al piano gratuito')); render(); break;
    case 'secOpen': state.uiOpen = state.uiOpen || {}; state.uiOpen[el.dataset.k] = true; render(); break;
    case 'editName': openSheet(sheetProfile()); break;
    // L'input file vero e' nascosto nella pagina: il bottone lo apre. Stessa
    // strada gia' usata per le foto dei piani e dei posti.
    case 'cambiaFoto': state.mediaTarget = { kind:'avatar' }; $('#photoInput').click(); break;
    case 'saveProfile': { const n = $('#pname').value.trim(); if(!n){ toast('Il nome serve'); break; } me().name = n; me().email = $('#pemail').value.trim().toLowerCase(); closeSheet(); toast('Profilo aggiornato'); render(); break; }
    case 'addFriends': openSheet(sheetFriends()); break;
    case 'addFriend': { const u = me(); if(!u.friends.includes(el.dataset.id)) u.friends.push(el.dataset.id); toast(`${nameOf(el.dataset.id)} aggiunto`); openSheet(sheetFriends()); render(); break; }
    case 'rmFriend': { const u = me(); u.friends = u.friends.filter(x => x !== el.dataset.id); render(); break; }
    case 'mergeSheet': openSheet(sheetMerge()); break;
    case 'doMerge': { const em = $('#mergeEmail').value.trim().toLowerCase(); if(!em.includes('@')){ toast('Controlla l\'email'); break; } const w = Object.values(state.people).find(x => x.web && x.email === em); if(!w){ toast(t('Nessuna partecipazione web con questa email')); break; } const n = mergePersona(w.id, state.me); if(!me().email) me().email = em; closeSheet(); toast(`Collegati ${n} ${n === 1 ? 'piano' : 'piani'}`); render(); break; }
  }
});
$('#photoInput').addEventListener('change', e => {
  const mt = state.mediaTarget; const files = [...e.target.files].slice(0, 10); if(!files.length) return; let left = files.length;
  const done = () => { e.target.value = ''; };
  if(mt && mt.kind === 'place'){ const pl = me().places.find(x => x.id === mt.id); state.mediaTarget = null;
    const room = myLim().placePhotos - pl.photos.length; if(room <= 0){ toast(`Massimo ${myLim().placePhotos} foto per posto`); done(); return; }
    const use = files.slice(0, room); left = use.length;
    use.forEach(f => { const r = new FileReader(); r.onload = () => { pl.photos.push({ id:uid(), dataUrl:r.result, name:f.name }); if(--left === 0){ toast('Foto aggiunte'); openSheet(sheetPlace(pl)); } }; r.readAsDataURL(f); }); done(); return; }
  const p = state.plans[state.currentPlan]; if(!p) return;
  const L = planLim(p); const room = L.photos - p.photos.length;
  if(room <= 0){ toast(`Limite di ${L.photos} foto per piano`); done(); return; }
  const use = files.slice(0, room); left = use.length; if(files.length > use.length) toast(`Spazio solo per ${use.length}: limite ${L.photos} foto`);
  use.forEach(f => { const r = new FileReader(); r.onload = () => { p.photos.push({ id:uid(), by:state.me, at:Date.now(), dataUrl:r.result, name:f.name }); if(--left === 0){ sysComment(p, 'photo', `${nameOf(state.me)} ha aggiunto ${use.length === 1 ? t('una foto') : t('{n} foto', { n: use.length })}`); toast('Foto aggiunte (compresse)'); render(); } }; r.readAsDataURL(f); }); done();
});
$('#fileInput').addEventListener('change', e => {
  const mt = state.mediaTarget; const f = e.target.files[0]; if(!f) return;
  if(mt && mt.kind === 'place'){ const pl = me().places.find(x => x.id === mt.id); state.mediaTarget = null; pl.files.push({ id:uid(), name:f.name, size:f.size, at:Date.now() }); toast('Allegato aggiunto'); openSheet(sheetPlace(pl)); e.target.value = ''; return; }
  const p = state.plans[state.currentPlan]; if(!p) return; const L = planLim(p);
  if((f.type || '').startsWith('video')){ toast(t('I video no: metti un link YouTube o Drive')); e.target.value = ''; return; }
  if(f.size > L.file){ toast(`Allegato troppo grande: max ${Math.round(L.file / 1e6)} MB`); e.target.value = ''; return; }
  if(attachBytes(p) + f.size > L.attach){ toast(`Spazio allegati del piano esaurito (${Math.round(L.attach / 1e6)} MB)`); e.target.value = ''; return; }
  p.files.push({ id:uid(), name:f.name, size:f.size, by:state.me, at:Date.now() }); sysComment(p, 'photo', `${nameOf(state.me)} ha allegato ${f.name}`); toast('Allegato aggiunto'); render(); e.target.value = '';
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target && e.target.id === 'commentInput'){ e.preventDefault(); const b = $('[data-action="comment"]'); if(b) b.click(); } });
window.addEventListener('hashchange', render);
reset();
window.__kimari = { state, render, aggiorna, t, LINGUA, reset, createPlan, createDecision, joinPlan, confirmPlan, editPlan, icsFor, msgs, calItems, monthGrid, feedItems, balances, settleSuggestions, mergePersona, newsCount, $, toast, go, closeSheet, openSheet, sheetWelcome, sheetJoinPolicy, msgSheet, sheetName };
render();
})();
</script>
