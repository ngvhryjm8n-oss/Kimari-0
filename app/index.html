<title>Kimari — prototipo app v3</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --sec:#8E8E93; --ter:#C7C7CC;
    --sep:rgba(60,60,67,.29); --fill:#E9E9EB; --fill2:#F2F2F7; --bar:rgba(249,249,249,.94);
    --blue:#007AFF; --blue-bg:#E8F1FF; --green:#34C759; --green-bg:#E4F8EA; --green-fg:#1B7B3A;
    --wa:#25D366; --wa-bubble:#DCF8C6; --red:#FF3B30; --amber:#FF9500; --amber-bg:#FFF2DF; --amber-fg:#A85B00;
    --radius:12px; --nav-h:48px; --dev-h:34px;
    --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --rounded:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --sec:#8E8E93; --ter:#48484A;
      --sep:rgba(84,84,88,.65); --fill:#2C2C2E; --fill2:#1C1C1E; --bar:rgba(22,22,24,.94);
      --blue:#0A84FF; --blue-bg:#0B2A4F; --green:#30D158; --green-bg:#0F3A21; --green-fg:#7BE29A;
      --amber:#FF9F0A; --amber-bg:#3A2A0B; --amber-fg:#FFC46B;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; height:100%}
  body{font-family:var(--font); font-size:17px; line-height:1.3; color:var(--label); background:var(--bg); -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; overflow:hidden}
  button{font-family:inherit; font-size:inherit; color:inherit; -webkit-tap-highlight-color:transparent}
  a{color:var(--blue); text-decoration:none}
  input,textarea,select{font-family:inherit}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }

  /* ---------- barra prototipo ---------- */
  #devbar{position:fixed; top:0; left:0; right:0; z-index:60; height:calc(var(--dev-h) + env(safe-area-inset-top)); padding:env(safe-area-inset-top) 12px 0; display:flex; align-items:center; gap:10px; background:#1C1C1E; color:#fff; font-size:12px; font-weight:600}
  #devbar .lab{opacity:.6}
  #devbar select{background:#2C2C2E; color:#fff; border:0; border-radius:8px; padding:4px 8px; font-size:12px; font-weight:600; -webkit-appearance:none; appearance:none; max-width:170px}
  #devbar .spacer{flex:1}
  #devbar button{background:transparent; border:0; color:#fff; opacity:.75; font-size:12px; font-weight:600; padding:4px 6px; border-radius:6px}

  /* ---------- guscio app ---------- */
  #app{position:relative; max-width:430px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; padding-top:calc(var(--dev-h) + env(safe-area-inset-top))}
  .screen{flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; padding-bottom:16px; scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  @media (min-width:720px){
    body{background:#D9D9DE}
    #app{margin:24px auto 0; height:calc(100vh - 48px); border-radius:44px; background:var(--bg); box-shadow:0 30px 80px rgba(0,0,0,.35); border:10px solid #121212; overflow:hidden}
    #devbar{max-width:410px; left:50%; transform:translateX(-50%); top:34px; border-radius:34px 34px 0 0; padding-left:22px}
  }

  /* ---------- tab bar ---------- */
  .tabbar{flex:none; height:calc(50px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); display:flex; background:var(--bar); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-top:.5px solid var(--sep)}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border:0; background:none; color:var(--sec); font-size:10px; font-weight:500; padding:0}
  .tab svg{width:26px; height:26px}
  .tab.on{color:var(--blue)}

  /* ---------- navigazione ---------- */
  .nav{position:sticky; top:0; z-index:20; height:var(--nav-h); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 8px; background:rgba(242,242,247,.88); background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-bottom:.5px solid var(--sep)}
  .nav h1{margin:0; font-size:17px; font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px}
  .nav .back{display:inline-flex; align-items:center; gap:2px; font-size:17px; color:var(--blue); padding:6px 4px; background:none; border:0; white-space:nowrap}
  .nav .back svg{width:12px; height:20px}
  .nav .right{display:flex; justify-content:flex-end; align-items:center; gap:4px; font-size:15px; color:var(--sec); padding-right:4px}
  .nav .textbtn{background:none; border:0; color:var(--blue); font-size:17px; padding:6px 4px}
  .iconbtn{background:none; border:0; color:var(--blue); padding:6px; display:inline-flex}
  .iconbtn svg{width:24px; height:24px}

  .large{margin:12px 16px 12px; font-size:34px; line-height:1.15; font-weight:700; letter-spacing:-.4px}
  .pad{padding:0 16px}
  .stack>*+*{margin-top:10px}
  .center{text-align:center}
  .sec{color:var(--sec)}
  .foot{font-size:13px; color:var(--sec); margin:8px 32px 20px; line-height:1.35}
  .grow{flex:1; min-width:0}
  .t{font-size:17px; line-height:1.25}
  .s{font-size:13px; color:var(--sec); line-height:1.3}
  .view{animation:fadeup .22s ease-out}
  @keyframes fadeup{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  /* ---------- liste ---------- */
  .group-title{font-size:13px; color:var(--sec); text-transform:uppercase; letter-spacing:.3px; margin:22px 32px 8px}
  .group{background:var(--card); border-radius:var(--radius); margin:0 16px; overflow:hidden}
  .group-foot{font-size:13px; color:var(--sec); margin:8px 32px 0; line-height:1.35}
  .row{display:flex; align-items:center; gap:12px; min-height:48px; padding:10px 16px; position:relative; width:100%; text-align:left; background:none; border:0; color:inherit}
  .row+.row::before{content:""; position:absolute; left:16px; right:0; top:0; height:.5px; background:var(--sep)}
  .row.col{flex-direction:column; align-items:stretch; gap:6px}
  .row .line{display:flex; align-items:center; gap:10px}
  .row.link:active{background:var(--fill2)}
  .chev{width:8px; height:8px; border:solid var(--ter); border-width:2px 2px 0 0; transform:rotate(45deg); margin-right:4px; flex:none}
  .row .x{background:var(--fill); border:0; width:26px; height:26px; border-radius:50%; color:var(--sec); font-size:18px; line-height:1; flex:none}
  .row .add{background:none; border:0; color:var(--blue); font-weight:600; font-size:15px; padding:4px 0; flex:none}
  .input{flex:1; min-width:0; width:100%; border:0; background:transparent; font-size:17px; color:var(--label); outline:none; padding:0; height:28px}
  .input::placeholder{color:var(--ter)}
  .input.right{text-align:right; flex:none; width:auto}
  input[type="datetime-local"].input{color:var(--blue); font-size:15px}
  textarea.input{height:auto; resize:none; line-height:1.35; padding:4px 0}
  .emoji{font-size:24px; line-height:1; flex:none; width:32px; text-align:center}
  .emoji.big{font-size:30px; width:40px}
  .emoji.huge{font-size:44px; width:auto}

  /* ---------- controlli ---------- */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:50px; border-radius:12px; font-size:17px; font-weight:600; border:0; cursor:pointer; transition:transform .08s ease, opacity .15s ease; text-decoration:none}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--blue); color:#fff}
  .btn.tint{background:var(--blue-bg); color:var(--blue)}
  .btn.wa{background:var(--wa); color:#fff}
  .btn.plain{background:transparent; color:var(--blue); height:44px}
  .btn.danger{background:transparent; color:var(--red); height:44px}
  .btn.sm{height:40px; font-size:15px; border-radius:10px}
  .cta{position:sticky; bottom:0; z-index:15; display:flex; gap:10px; padding:12px 16px 12px; background:linear-gradient(to bottom, transparent, var(--bg) 35%)}
  .seg{display:flex; background:var(--fill); padding:2px; border-radius:9px}
  .seg button{flex:1; border:0; background:transparent; font-size:13px; font-weight:500; padding:7px 4px; border-radius:7px; color:var(--label); white-space:nowrap}
  .seg button.on{background:var(--card); box-shadow:0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); font-weight:600}
  .chips{display:flex; gap:8px; flex-wrap:wrap; padding:10px 16px 0}
  .chip{background:var(--card); border:0; border-radius:999px; padding:8px 14px; font-size:15px; font-weight:500; box-shadow:0 0 0 .5px var(--sep) inset}
  .chip.on{background:var(--blue); color:#fff; box-shadow:none}
  .chk{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--ter); flex:none; display:flex; align-items:center; justify-content:center; transition:background .12s, border-color .12s}
  .row.on .chk{background:var(--blue); border-color:var(--blue)}
  .row.on .chk::after{content:""; width:6px; height:11px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); margin-top:-3px}
  .sw{width:51px; height:31px; border-radius:16px; background:var(--fill); position:relative; transition:background .2s; flex:none; border:0; padding:0}
  .sw::after{content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.1); transition:left .2s}
  .sw.on{background:var(--green)}
  .sw.on::after{left:22px}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; padding:5px 10px; border-radius:999px}
  .badge.deciding{background:var(--amber-bg); color:var(--amber-fg)}
  .badge.confirmed{background:var(--green-bg); color:var(--green-fg)}
  .badge.gray{background:var(--fill); color:var(--sec); text-transform:none; letter-spacing:0; font-weight:600}
  .badges{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:12px}
  .bar{height:6px; border-radius:3px; background:var(--fill); overflow:hidden}
  .bar i{display:block; height:100%; background:var(--blue); border-radius:3px; transition:width .4s cubic-bezier(.2,.8,.2,1)}
  .n{font-variant-numeric:tabular-nums; font-weight:600; color:var(--sec); min-width:20px; text-align:right}
  .tag{display:inline-block; font-size:11px; font-weight:700; color:var(--green-fg); background:var(--green-bg); padding:2px 7px; border-radius:999px; vertical-align:middle; margin-left:6px; text-transform:uppercase; letter-spacing:.3px}
  .tag.amber{color:var(--amber-fg); background:var(--amber-bg)}
  .avatar{width:28px; height:28px; border-radius:50%; color:#fff; font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:none; letter-spacing:.3px}
  .avatar.xl{width:72px; height:72px; font-size:26px; margin:0 auto 8px}
  .avatars{display:flex; align-items:center}
  .avatars .avatar{margin-left:-7px; box-shadow:0 0 0 2px var(--card)}
  .avatars .avatar:first-child{margin-left:0}
  .count{font-size:15px; color:var(--sec); font-variant-numeric:tabular-nums; margin-left:4px; flex:none}

  /* ---------- card ---------- */
  .card{background:var(--card); border-radius:16px; padding:20px 16px; text-align:center}
  .card .title{margin:6px 0 2px; font-size:28px; font-weight:700; letter-spacing:-.3px; line-height:1.15}
  .card .when{font-size:20px; font-weight:600; margin-top:6px}
  .card .where{font-size:17px; margin-top:2px}
  .kimari{font-family:var(--rounded); font-weight:800; font-size:15px; letter-spacing:.5px; color:var(--green-fg); text-transform:uppercase}
  .hero .bigcheck{width:64px; height:64px; border-radius:50%; background:var(--green); color:#fff; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}
  .hero .bigcheck svg{width:30px; height:30px}
  @keyframes pop{0%{transform:scale(.4); opacity:0} 60%{transform:scale(1.08); opacity:1} 100%{transform:scale(1)}}
  .intro{background:var(--blue-bg); color:var(--blue); border-radius:12px; padding:12px 14px; font-size:15px; font-weight:500; margin:16px 16px 0; line-height:1.35}
  .notice{background:var(--green-bg); color:var(--green-fg); border-radius:12px; padding:12px 14px; font-size:15px; font-weight:600; margin:16px 16px 0}
  .stats{display:flex; justify-content:center; gap:28px; margin:14px 0 8px}
  .stats div{display:flex; flex-direction:column; align-items:center}
  .stats b{font-size:20px}
  .stats span{font-size:12px; color:var(--sec)}

  /* ---------- calendario ---------- */
  .cal{background:var(--card); margin:10px 16px 0; border-radius:16px; padding:6px 6px 4px; user-select:none; -webkit-user-select:none}
  .cal-head{display:flex; align-items:center; gap:4px; padding:4px 4px 6px}
  .cal-title{flex:1; font-size:20px; font-weight:700; letter-spacing:-.2px; padding-left:6px}
  .cal-nav{background:none; border:0; color:var(--blue); width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; padding:0}
  .cal-nav svg{width:12px; height:20px}
  .cal-today{background:var(--fill); border:0; border-radius:999px; padding:5px 10px; font-size:13px; font-weight:600; color:var(--blue); margin-right:2px}
  .cal-dow{display:grid; grid-template-columns:repeat(7,1fr); font-size:12px; font-weight:600; color:var(--sec); text-align:center; padding-bottom:2px}
  .cal-week{position:relative; display:grid; grid-template-columns:repeat(7,1fr); height:52px; border-top:.5px solid var(--sep)}
  .cal-day{background:none; border:0; padding:3px 0 0; display:flex; flex-direction:column; align-items:center; gap:1px; color:inherit}
  .cal-day.past .num{color:var(--sec)}
  .num{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-variant-numeric:tabular-nums}
  .num.today{background:var(--red); color:#fff; font-weight:700}
  .num.sel:not(.today){background:var(--label); color:var(--bg); font-weight:600}
  .dots{display:flex; gap:3px; height:8px; align-items:center}
  .dot{width:6px; height:6px; border-radius:50%; display:block}
  .dot.ring{background:transparent; border:1.5px solid var(--amber); width:7px; height:7px}
  .cal-bar{position:absolute; height:5px; border-radius:3px; border:0; padding:0; cursor:pointer}
  .agenda{margin:8px 16px 0}
  .agenda .time{font-variant-numeric:tabular-nums; font-size:13px; color:var(--sec); width:62px; flex:none}
  .agenda .cdot{width:10px; height:10px; border-radius:50%; flex:none}
  .agenda .cdot.ring{background:transparent; border:2px solid var(--amber)}
  .list-head{display:flex; align-items:flex-end; justify-content:space-between; margin:26px 16px 2px}
  .list-head h2{margin:0; font-size:28px; font-weight:700; letter-spacing:-.3px}
  .gicon{width:38px; height:38px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; font-size:22px; flex:none; border:0; padding:0}
  .gicon.xl{width:76px; height:76px; border-radius:20px; font-size:42px; margin:0 auto 8px}
  .emoji-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; padding:0 16px}
  .emoji-grid button{font-size:24px; background:var(--card); border:0; border-radius:10px; height:44px; padding:0}
  .emoji-grid button.on{background:var(--blue-bg); box-shadow:0 0 0 2px var(--blue) inset}
  .swatches{display:flex; gap:10px; padding:0 16px; flex-wrap:wrap}
  .swatches button{width:32px; height:32px; border-radius:50%; border:0; padding:0}
  .swatches button.on{box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--label)}

  /* ---------- home (web) ---------- */
  .home{padding:40px 24px 8px; text-align:center}
  .home .logo{font-size:64px; line-height:1}
  .home .brand{font-family:var(--rounded); font-weight:800; font-size:40px; letter-spacing:-.5px; margin:8px 0 6px}
  .home .tagline{font-size:19px; color:var(--sec); margin:0 0 28px; line-height:1.3}

  /* ---------- WhatsApp ---------- */
  .wa-bg{background:#E5DDD5; padding:16px 0; margin:16px 0 0; border-radius:14px}
  .wa-bubble{background:var(--wa-bubble); color:#000; border-radius:14px; padding:10px 12px 8px; font-size:15px; line-height:1.35; white-space:pre-wrap; word-break:break-word; margin:0 16px}
  .wa-preview{background:rgba(0,0,0,.06); border-radius:10px; padding:10px 12px; margin-top:8px; border-left:4px solid var(--green)}
  .wa-preview .pt{font-weight:700; font-size:15px}
  .wa-preview .ps{font-size:13px; color:#3C3C43; opacity:.8; margin-top:2px}
  .wa-preview .ph{font-size:12px; color:#3C3C43; opacity:.6; margin-top:4px}
  .wa-time{text-align:right; font-size:11px; color:rgba(0,0,0,.45); margin-top:4px}
  @media (prefers-color-scheme: dark){ .wa-bg{background:#0B141A} .wa-bubble{background:#005C4B; color:#fff} .wa-preview{background:rgba(255,255,255,.08)} .wa-preview .ps,.wa-preview .ph{color:#fff} .wa-time{color:rgba(255,255,255,.5)} }
  

  /* ---------- proposte, commenti, media ---------- */
  .proposal{margin:16px 16px 0; background:var(--card); border-radius:14px; padding:14px 16px; box-shadow:0 0 0 1.5px var(--amber) inset}
  .proposal .pr-head{font-size:12px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--amber-fg); margin-bottom:6px}
  .proposal .pr-votes{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0 8px}
  .proposal .pr-actions{display:flex; gap:8px; margin-top:10px}
  .row.sys{min-height:34px; padding:6px 16px}
  .row.sys .s{font-style:italic}
  .photos{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:0 16px}
  .photo{border:0; padding:0; background:none; aspect-ratio:1; border-radius:8px; overflow:hidden}
  .photo img{width:100%; height:100%; object-fit:cover; display:block}
  #lightbox{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center}
  #lightbox.show{display:flex}
  #lightbox img{max-width:100%; max-height:100%; object-fit:contain}
  .btn[disabled]{opacity:.4; pointer-events:none}

  .tab{position:relative}
  .tab .badge-n{position:absolute; top:5px; left:calc(50% + 6px); background:var(--red); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; line-height:1}
  .amt{font-variant-numeric:tabular-nums; font-weight:600; flex:none}
  .pos{color:var(--green-fg)} .neg{color:var(--red)}
  .row.lock{opacity:.5}
  .seg.grow{flex:1}

  .yn{display:flex; gap:10px}
  .yn-btn{flex:1; height:64px; border-radius:14px; border:0; background:var(--card); font-size:20px; font-weight:700; box-shadow:0 0 0 .5px var(--sep) inset; transition:transform .08s}
  .yn-btn:active{transform:scale(.97)}
  .yn-btn.yes.on{background:var(--green); color:#fff; box-shadow:none}
  .yn-btn.no.on{background:var(--red); color:#fff; box-shadow:none}

  .thumb{width:38px; height:38px; border-radius:10px; object-fit:cover; flex:none}
  .cover{display:block; width:calc(100% - 32px); height:150px; object-fit:cover; border-radius:14px; margin:12px 16px 0; cursor:pointer}
  .where-photo{display:block; width:100%; max-width:300px; height:130px; object-fit:cover; border-radius:12px; margin:12px auto 0}
  .photo{position:relative}
  .photo img{cursor:pointer}
  .pbtn{position:absolute; top:4px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:0; font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0}
  .pbtn.del{right:4px}
  .pbtn.cov{left:4px}
  .pbtn.cov.on{background:var(--amber)}

  .mascot-hero{width:150px; height:auto; display:block; margin:0 auto 2px; animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}

  .mi{display:inline-flex; align-items:center; justify-content:center; flex:none; background:#fff; box-shadow:0 0 0 .5px var(--sep)}

  .mplate{display:inline-flex; background:#fff; border-radius:26px; padding:10px 16px; box-shadow:0 0 0 .5px var(--sep); margin-bottom:4px}
  .mplate .mascot-hero{margin:0}

  .ptile{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; background:hsl(var(--h,215) 85% 91%)}
  .card.hero{background:linear-gradient(180deg, hsl(var(--h,140) 78% 94%), var(--card) 72%)}
  .card.hero .title{font-size:26px}
  .card.hero .when{font-size:18px; font-weight:700}
  .ctabar{position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom, 0px) + 74px); z-index:60; display:flex; gap:10px; background:var(--bar); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); padding:10px; border-radius:20px; box-shadow:0 10px 34px rgba(0,0,0,.22)}
  .ctabar .btn{margin:0}
  @media (prefers-color-scheme: dark){
    .ptile{background:hsl(var(--h,215) 45% 25%)}
    .card.hero{background:linear-gradient(180deg, hsl(var(--h,140) 45% 17%), var(--card) 72%)}
  }

  .greet-b{font-size:32px; font-weight:800; letter-spacing:-.4px}
  .greet-d{font-size:15px; color:var(--sec); font-weight:600; margin-top:1px}
  .card.todo{text-align:left; padding:13px 16px 5px}
  .todo-h{display:flex; align-items:center; gap:10px; font-size:17px; padding-bottom:9px}
  .todo-r{display:flex; align-items:center; gap:11px; width:100%; background:none; border:0; padding:10px 0; border-top:.5px solid var(--sep); font:inherit; color:var(--label); cursor:pointer}
  .tag.okk{background:var(--green-bg); color:var(--green-fg)}
  .card.tinted{background:linear-gradient(180deg, hsl(var(--h,215) 80% 95%), var(--card) 70%)}
  .plusb{width:38px; height:38px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; margin-top:-8px; box-shadow:0 4px 12px rgba(0,122,255,.35)}
  .plusb svg{width:22px; height:22px}
  .tab.on .plusb{background:var(--blue)}
  @media (prefers-color-scheme: dark){
    .card.tinted{background:linear-gradient(180deg, hsl(var(--h,215) 42% 18%), var(--card) 70%)}
  }

  /* ---------- sheet / toast ---------- */
  .overlay{position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  .sheet{background:var(--bg); width:100%; max-width:430px; max-height:88dvh; overflow:auto; border-radius:18px 18px 0 0; padding:6px 0 calc(16px + env(safe-area-inset-bottom)); animation:up .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px); opacity:.6} to{transform:none; opacity:1}}
  .grab{width:36px; height:5px; border-radius:3px; background:var(--ter); margin:6px auto 10px}
  .sheet h2{margin:8px 16px 4px; font-size:22px; font-weight:700; letter-spacing:-.2px}
  .sheet .sub{margin:0 16px 12px; font-size:15px; color:var(--sec)}
  .sheet .group-title{margin-top:18px}
  .sheet .actions{padding:18px 16px 0}
  #toast{position:fixed; left:50%; bottom:calc(70px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); background:#1C1C1E; color:#fff; padding:10px 16px; border-radius:999px; font-size:15px; font-weight:600; opacity:0; pointer-events:none; transition:all .2s; z-index:90; white-space:nowrap}
  #toast.show{opacity:1; transform:translate(-50%, 0)}
  .proto{margin:24px 16px 0; padding:14px; border:1px dashed var(--ter); border-radius:12px}
  .proto .lab{font-size:12px; font-weight:700; color:var(--sec); text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px}
  .history .v{font-size:12px; font-weight:700; color:var(--sec); background:var(--fill); border-radius:6px; padding:2px 6px; flex:none}
  .feed .row{align-items:flex-start}
  .feed .avatar{margin-top:2px}
</style>
</head>

/* =============================== render =============================== */
function route(){ const h = location.hash.replace(/^#\/?/, ''); const [name, arg] = h.split('/'); return { name: name || 'home', arg }; }
function go(h){ if(location.hash === '#' + h) render(); else location.hash = h; }
function planByRoute(r){ if(r.name === 'p' || r.name === 'share') return state.plans[r.arg]; if(r.name === 'i') return Object.values(state.plans).find(p => p.token === r.arg); return null; }
function renderDevbar(){
  const sel = $('#who');
  sel.innerHTML = Object.values(state.people).filter(p => !p.web).map(p => `<option value="${p.id}" ${state.me === p.id ? 'selected' : ''}>${esc(p.name)} (app)</option>`).join('')
    + Object.values(state.people).filter(p => p.web).map(p => `<option value="${p.id}" ${state.me === p.id ? 'selected' : ''}>${esc(p.name)} (web)</option>`).join('')
    + `<option value="guest" ${state.me === 'guest' ? 'selected' : ''}>＋ Nuovo ospite (web)</option>`;
}
function render(){
  const kk = (location.hash.replace('#','') || 'home').split('/')[0];
  if(state._lastRoute !== location.hash){ state._lastRoute = location.hash; state.visits = state.visits || {}; state.visits[kk] = (state.visits[kk] || 0) + 1; }
  curRoute = kk;
  const r = route(); const prev = $('#screen'); const keep = prev && state.lastRoute === location.hash ? prev.scrollTop : 0;
  let html = '', tab = 'home', showTab = !isWeb();
  if(r.name === 'new'){ if(!state.draft) state.draft = newDraft(); html = vNew(); tab = 'new'; showTab = false; }
  else if(r.name === 'share'){ const p = planByRoute(r); html = p ? vShare(p) : vInvalid(); showTab = false; }
  else if(r.name === 'p' || r.name === 'i'){ const p = planByRoute(r); if(p) state.currentPlan = p.id; html = p ? vPlan(p) : vInvalid(); }
  else if(r.name === 'g' && !isWeb()){ const g = state.groups[r.arg]; html = g ? vGroup(g) : vHome(); }
  else if(r.name === 'news' && !isWeb()){ html = vNews(); tab = 'news'; }
  else if(r.name === 'profile' && !isWeb()){ html = vProfile(); tab = 'profile'; }
  else html = vHome();
  if(r.name === 'news' && !isWeb()) state.lastSeenNews = Date.now();
  $('#app').innerHTML = `<div class="screen" id="screen">${html}</div>${showTab ? tabbar(tab) : ''}`;
  $('#screen').scrollTop = keep; state.lastRoute = location.hash; renderDevbar();
  if(!isWeb() && !state.consented && !state.welcomeShown){ state.welcomeShown = true; setTimeout(() => openSheet(sheetWelcome()), 60); }
}

/* =============================== azioni =============================== */
function setPath(obj, path, val){ const ks = path.split('.'); let o = obj; ks.slice(0,-1).forEach(k => { o = o[k]; }); o[ks[ks.length-1]] = val; }
const parseWhen = (start, end, allDay) => start ? { id:uid(), start, end:end || '', allDay:!!allDay } : null;
function afterJoin(p){
  state.ballotDraft = null; state.bdKey = null; state.justVoted = false; const t = state.pendingTap; state.pendingTap = null;
  if(t && t.field){ const bd = ensureBallotDraft(p); if(t.id) bd[t.field].approved.add(t.id); else bd[t.field].noneOk = true; }
  if(t && typeof t.rsvp === 'number'){ const m = p.participants.find(x => x.id === state.me); if(m){ m.rsvp = ['yes','maybe','no'][t.rsvp]; m.rsvpAt = Date.now(); } }
  toast(`Ciao ${nameOf(state.me)}!`); go(`p/${p.id}`);
}
function switchPersona(v){

    /* commenti, allegati, foto */
    case 'comment': { const v = $('#commentInput').value.trim(); if(!v) break; p.comments.push({ id:uid(), by:state.me, at:Date.now(), text:v, system:false }); render(); break; }
    case 'delComment': { const c = p.comments.find(x => x.id === el.dataset.id); if(!c || !(canModerate(p) || c.by === state.me)) break; p.comments = p.comments.filter(x => x.id !== el.dataset.id); if(c.by !== state.me) sysComment(p, 'mod', `${nameOf(state.me)} ha rimosso un commento di ${nameOf(c.by)}`); render(); break; }
    case 'addPhoto': $('#photoInput').click(); break;
    case 'addFile': $('#fileInput').click(); break;
    case 'addLink': openSheet(sheetLink()); break;
    case 'saveLink': { let u = $('#lkUrl').value.trim(); if(!u){ toast('Incolla un link'); break; } if(!/^https?:\/\//i.test(u)) u = 'https://' + u; const n = $('#lkName').value.trim() || u.replace(/^https?:\/\//, '').split('/')[0]; const mt = state.mediaTarget; if(mt && mt.kind === 'place'){ const pl = me().places.find(x => x.id === mt.id); pl.files.push({ id:uid(), name:n, url:u, at:Date.now() }); state.mediaTarget = null; openSheet(sheetPlace(pl)); } else { p.files.push({ id:uid(), name:n, url:u, by:state.me, at:Date.now() }); sysComment(p, 'photo', `${nameOf(state.me)} ha aggiunto il link ${n}`); closeSheet(); render(); } toast('Link aggiunto'); break; }
    case 'delFile': { const f = p.files.find(x => x.id === el.dataset.id); if(!f || !(canModerate(p) || f.by === state.me)) break; p.files = p.files.filter(x => x.id !== el.dataset.id); render(); break; }
    case 'lightbox': { const ph = p.photos.find(x => x.id === el.dataset.id); if(ph){ $('#lightbox').innerHTML = `<img src="${ph.dataUrl}" alt="">`; $('#lightbox').classList.add('show'); } break; }
    case 'closeLightbox': $('#lightbox').classList.remove('show'); break;

    /* spese */
    case 'addExpense': state.edraft = { desc:'', amount:'', payer:state.me, among:'yes', picked:new Set() }; openSheet(sheetExpense(p)); break;
    case 'exPayer': state.edraft.payer = el.dataset.v; openSheet(sheetExpense(p)); break;
    case 'exAmong': state.edraft.among = el.dataset.v; openSheet(sheetExpense(p)); break;
    case 'exPick': { const pk = state.edraft.picked; pk.has(el.dataset.v) ? pk.delete(el.dataset.v) : pk.add(el.dataset.v); openSheet(sheetExpense(p)); break; }
    case 'saveExpense': {
      const ed = state.edraft; const amt = parseEur(ed.amount); if(!ed.desc.trim()){ toast('Scrivi cosa hai pagato'); break; } if(!amt || amt <= 0){ toast('Importo non valido'); break; }
      let among;
      if(ed.among === 'pick'){ among = [...ed.picked]; if(!among.length){ toast('Scegli per chi è la spesa'); break; } }
      else { among = ed.among === 'yes' ? p.participants.filter(x => x.rsvp === 'yes').map(x => x.id) : p.participants.map(x => x.id); if(!among.includes(ed.payer)) among = [ed.payer, ...among]; if(among.length < 2 && ed.among === 'yes') among = p.participants.map(x => x.id); }
      p.expenses.push({ id:uid(), desc:ed.desc.trim(), amount:amt, by:ed.payer, among, at:Date.now(), voided:false }); sysComment(p, 'expense', `${nameOf(ed.payer)} ha pagato ${fmtEur(amt)} · ${ed.desc.trim()}${ed.among === 'pick' ? ' (per ' + among.map(id => id === ed.payer ? 'sé' : nameOf(id)).join(', ') + ')' : ''}`); closeSheet(); state.edraft = null; toast('Spesa registrata'); render(); break;
    }
    case 'voidExpense': { const ex = p.expenses.find(x => x.id === el.dataset.id); if(!ex) break; ex.voided = true; sysComment(p, 'expense', `${nameOf(state.me)} ha annullato la spesa "${ex.desc}" (${fmtEur(ex.amount)})`); toast('Spesa annullata'); render(); break; }
    case 'settle': { const s = { id:uid(), from:el.dataset.from, to:el.dataset.to, amount:+el.dataset.amount, at:Date.now(), by:state.me }; p.settlements.push(s); sysComment(p, 'expense', `💸 ${nameOf(s.from)} ha pagato ${fmtEur(s.amount)} a ${nameOf(s.to)}`); toast('Pagamento registrato'); render(); break; }

    /* posti salvati */
    case 'savePlaceDraft': { const pl = savePlace(d.whereFixed.name, d.whereFixed.address); if(pl) toast('Salvato tra i tuoi posti ★'); render(); break; }
    case 'savePlaceFromPlan': { const pl = savePlace(p.where.value.name, p.where.value.address); if(pl){ pl.used += 1; if(p.where.value.photo) pl.photos.push({ id:uid(), dataUrl:p.where.value.photo, name:'Dal piano' }); toast('Salvato tra i tuoi posti ★'); } render(); break; }
    case 'newPlace': { const pl = { id:uid(), name:'', address:'', note:'', photos:[], files:[], createdAt:Date.now(), used:0 }; me().places.push(pl); state.placeId = pl.id; openSheet(sheetPlace(pl)); break; }
    case 'openPlace': { state.placeId = el.dataset.id; openSheet(sheetPlace(me().places.find(x => x.id === el.dataset.id))); break; }
    case 'delPlace': { me().places = me().places.filter(x => x.id !== el.dataset.id); state.placeId = null; closeSheet(); toast('Posto eliminato'); render(); break; }
    case 'plDelFile': { const pl = me().places.find(x => x.id === el.dataset.pl); pl.files = pl.files.filter(x => x.id !== el.dataset.id); openSheet(sheetPlace(pl)); break; }
    case 'plAddPhoto': state.mediaTarget = { kind:'place', id:el.dataset.pl }; $('#photoInput').click(); break;
    case 'plAddFile': state.mediaTarget = { kind:'place', id:el.dataset.pl }; $('#fileInput').click(); break;
    case 'plAddLink': state.mediaTarget = { kind:'place', id:el.dataset.pl }; openSheet(sheetLink()); break;
    case 'plCover': { const pl = me().places.find(x => x.id === el.dataset.pl); const i = pl.photos.findIndex(x => x.id === el.dataset.id); if(i > 0){ const [ph] = pl.photos.splice(i, 1); pl.photos.unshift(ph); toast('Copertina aggiornata'); } openSheet(sheetPlace(pl)); break; }
    case 'plDelPhoto': { const pl = me().places.find(x => x.id === el.dataset.pl); pl.photos = pl.photos.filter(x => x.id !== el.dataset.id); openSheet(sheetPlace(pl)); break; }
    case 'plLightbox': { const pl = me().places.find(x => x.id === el.dataset.pl); const ph = pl && pl.photos.find(x => x.id === el.dataset.id); if(ph){ $('#lightbox').innerHTML = `<img src="${ph.dataUrl}" alt="">`; $('#lightbox').classList.add('show'); } break; }
    case 'fillPlace': { const t = el.dataset.t; const nEl = $('#' + t + 'Name'), aEl = $('#' + t + 'Addr'); if(nEl) nEl.value = el.dataset.name; if(aEl) aEl.value = el.dataset.address; break; }

    /* profilo */
    case 'push': state.settings.push[el.dataset.k] = !state.settings.push[el.dataset.k]; render(); break;
    case 'toggleUnlimited': me().unlimited = !me().unlimited; toast(me().unlimited ? 'Unlimited attivo (demo, non si paga)' : 'Tornato al piano gratuito'); render(); break;
    case 'secOpen': state.uiOpen = state.uiOpen || {}; state.uiOpen[el.dataset.k] = true; render(); break;
    case 'editName': openSheet(sheetProfile()); break;
    case 'saveProfile': { const n = $('#pname').value.trim(); if(!n){ toast('Il nome serve'); break; } me().name = n; me().email = $('#pemail').value.trim().toLowerCase(); closeSheet(); toast('Profilo aggiornato'); render(); break; }
    case 'addFriends': openSheet(sheetFriends()); break;
    case 'addFriend': { const u = me(); if(!u.friends.includes(el.dataset.id)) u.friends.push(el.dataset.id); toast(`${nameOf(el.dataset.id)} aggiunto`); openSheet(sheetFriends()); render(); break; }
    case 'rmFriend': { const u = me(); u.friends = u.friends.filter(x => x !== el.dataset.id); render(); break; }
    case 'mergeSheet': openSheet(sheetMerge()); break;
    case 'doMerge': { const em = $('#mergeEmail').value.trim().toLowerCase(); if(!em.includes('@')){ toast('Controlla l\'email'); break; } const w = Object.values(state.people).find(x => x.web && x.email === em); if(!w){ toast('Nessuna partecipazione web con questa email'); break; } const n = mergePersona(w.id, state.me); if(!me().email) me().email = em; closeSheet(); toast(`Collegati ${n} ${n === 1 ? 'piano' : 'piani'}`); render(); break; }
  }
});
$('#photoInput').addEventListener('change', e => {
  const mt = state.mediaTarget; const files = [...e.target.files].slice(0, 10); if(!files.length) return; let left = files.length;
  const done = () => { e.target.value = ''; };
  if(mt && mt.kind === 'place'){ const pl = me().places.find(x => x.id === mt.id); state.mediaTarget = null;
    const room = myLim().placePhotos - pl.photos.length; if(room <= 0){ toast(`Massimo ${myLim().placePhotos} foto per posto`); done(); return; }
    const use = files.slice(0, room); left = use.length;
    use.forEach(f => { const r = new FileReader(); r.onload = () => { pl.photos.push({ id:uid(), dataUrl:r.result, name:f.name }); if(--left === 0){ toast('Foto aggiunte'); openSheet(sheetPlace(pl)); } }; r.readAsDataURL(f); }); done(); return; }
  const p = state.plans[state.currentPlan]; if(!p) return;
  const L = planLim(p); const room = L.photos - p.photos.length;
  if(room <= 0){ toast(`Limite di ${L.photos} foto per piano`); done(); return; }
  const use = files.slice(0, room); left = use.length; if(files.length > use.length) toast(`Spazio solo per ${use.length}: limite ${L.photos} foto`);
  use.forEach(f => { const r = new FileReader(); r.onload = () => { p.photos.push({ id:uid(), by:state.me, at:Date.now(), dataUrl:r.result, name:f.name }); if(--left === 0){ sysComment(p, 'photo', `${nameOf(state.me)} ha aggiunto ${use.length === 1 ? 'una foto' : use.length + ' foto'}`); toast('Foto aggiunte (compresse)'); render(); } }; r.readAsDataURL(f); }); done();
});
$('#fileInput').addEventListener('change', e => {
  const mt = state.mediaTarget; const f = e.target.files[0]; if(!f) return;
  if(mt && mt.kind === 'place'){ const pl = me().places.find(x => x.id === mt.id); state.mediaTarget = null; pl.files.push({ id:uid(), name:f.name, size:f.size, at:Date.now() }); toast('Allegato aggiunto'); openSheet(sheetPlace(pl)); e.target.value = ''; return; }
  const p = state.plans[state.currentPlan]; if(!p) return; const L = planLim(p);
  if((f.type || '').startsWith('video')){ toast('I video no: metti un link YouTube o Drive'); e.target.value = ''; return; }
  if(f.size > L.file){ toast(`Allegato troppo grande: max ${Math.round(L.file / 1e6)} MB`); e.target.value = ''; return; }
  if(attachBytes(p) + f.size > L.attach){ toast(`Spazio allegati del piano esaurito (${Math.round(L.attach / 1e6)} MB)`); e.target.value = ''; return; }
  p.files.push({ id:uid(), name:f.name, size:f.size, by:state.me, at:Date.now() }); sysComment(p, 'photo', `${nameOf(state.me)} ha allegato ${f.name}`); toast('Allegato aggiunto'); render(); e.target.value = '';
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target && e.target.id === 'commentInput'){ e.preventDefault(); const b = $('[data-action="comment"]'); if(b) b.click(); } });
window.addEventListener('hashchange', render);
reset();
window.__kimari = { state, render, reset, createPlan, createDecision, joinPlan, confirmPlan, editPlan, icsFor, msgs, calItems, monthGrid, feedItems, balances, settleSuggestions, mergePersona, newsCount, $, toast, go, closeSheet, openSheet, sheetWelcome, sheetJoinPolicy };
render();
})();
</script>
