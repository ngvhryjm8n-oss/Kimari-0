<!-- Solo "Kimari": questo titolo finisce nell'anteprima quando si condivide
     un link su WhatsApp, ed e' il nome che legge chi non ha mai visto l'app.
     "prototipo app v3" era una nota per noi, letta da loro. -->
<title>Kimari</title>
<!-- Quello che WhatsApp mostra quando qualcuno inoltra un link di Kimari.
     Senza, l'anteprima e' un indirizzo nudo — e il link a un piano viene
     inoltrato a gente che Kimari non l'ha mai sentita nominare: e' il primo
     pezzo di prodotto che vedono.
     STATICI di proposito: generarli per singolo piano vorrebbe dire far
     passare il token d'invito da un servizio terzo, che e' esattamente cio'
     che il token deve evitare. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kimari">
<meta property="og:title" content="Kimari">
<meta property="og:description" content="Il gruppo vota, tu confermi. Kimari!">
<meta property="og:image" content="https://kimariapp.com/app/icona-192.png">
<meta property="og:url" content="https://kimariapp.com/">
<meta name="twitter:card" content="summary">

<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --sec:#8E8E93; --ter:#C7C7CC;
    --sep:rgba(60,60,67,.29); --fill:#E9E9EB; --fill2:#F2F2F7; --bar:rgba(249,249,249,.94);
    --blue:#007AFF; --blue-bg:#E8F1FF; --green:#34C759; --green-bg:#E4F8EA; --green-fg:#1B7B3A;
    --wa:#25D366; --wa-bubble:#DCF8C6; --red:#FF3B30; --amber:#FF9500; --amber-bg:#FFF2DF; --amber-fg:#A85B00;
    --radius:12px; --nav-h:48px; --dev-h:0px;   /* la barra demo non c'e': niente spazio riservato */
    --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --rounded:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --sec:#8E8E93; --ter:#48484A;
      --sep:rgba(84,84,88,.65); --fill:#2C2C2E; --fill2:#1C1C1E; --bar:rgba(22,22,24,.94);
      --blue:#0A84FF; --blue-bg:#0B2A4F; --green:#30D158; --green-bg:#0F3A21; --green-fg:#7BE29A;
      --amber:#FF9F0A; --amber-bg:#3A2A0B; --amber-fg:#FFC46B;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; height:100%}
  body{font-family:var(--font); font-size:17px; line-height:1.3; color:var(--label); background:var(--bg); -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; overflow:hidden}
  button{font-family:inherit; font-size:inherit; color:inherit; -webkit-tap-highlight-color:transparent}
  a{color:var(--blue); text-decoration:none}
  input,textarea,select{font-family:inherit}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }

  /* ---------- barra prototipo ---------- */
  #devbar{position:fixed; top:0; left:0; right:0; z-index:60; height:calc(var(--dev-h) + env(safe-area-inset-top)); padding:env(safe-area-inset-top) 12px 0; display:flex; align-items:center; gap:10px; background:#1C1C1E; color:#fff; font-size:12px; font-weight:600}
  /* La barra "Prototipo" e' un pannello da demo: cambia identita' in persone
     finte, crea ospiti finti e riempie l'app di dati inventati. Vincenzo l'ha
     trovata premendo Reset e ritrovandosi i piani di un Marco che non esiste.

     Nascosta di default, non "nascosta appena il database risponde": quella
     versione la faceva comparire per un secondo a ogni apertura, perche' il
     database ci mette un attimo. Un pannello di sviluppo che lampeggia
     all'avvio di un'app vera e' un difetto, non un dettaglio.

     Torna con ?demo=1, che e' l'unico posto dove serve davvero: far vedere il
     prototipo senza database. */
  #devbar{display:none}
  body[data-demo="1"] #devbar{display:flex}
  body[data-demo="1"]{--dev-h:34px}
  #devbar .lab{opacity:.6}
  #devbar select{background:#2C2C2E; color:#fff; border:0; border-radius:8px; padding:4px 8px; font-size:12px; font-weight:600; -webkit-appearance:none; appearance:none; max-width:170px}
  #devbar .spacer{flex:1}
  #devbar button{background:transparent; border:0; color:#fff; opacity:.75; font-size:12px; font-weight:600; padding:4px 6px; border-radius:6px}

  /* ---------- guscio app ---------- */
  #app{position:relative; max-width:430px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; padding-top:calc(var(--dev-h) + env(safe-area-inset-top))}
  .screen{flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; padding-bottom:16px; scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  @media (min-width:720px){
    body{background:#D9D9DE}
    #app{margin:24px auto 0; height:calc(100vh - 48px); border-radius:44px; background:var(--bg); box-shadow:0 30px 80px rgba(0,0,0,.35); border:10px solid #121212; overflow:hidden}
    #devbar{max-width:410px; left:50%; transform:translateX(-50%); top:34px; border-radius:34px 34px 0 0; padding-left:22px}
  }

  /* ---------- tab bar ---------- */
  .tabbar{flex:none; height:calc(50px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); display:flex; background:var(--bar); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-top:.5px solid var(--sep)}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border:0; background:none; color:var(--sec); font-size:10px; font-weight:500; padding:0}
  .tab svg{width:26px; height:26px}
  .tab.on{color:var(--blue)}

  /* ---------- navigazione ---------- */
  .nav{position:sticky; top:0; z-index:20; height:var(--nav-h); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 8px; background:rgba(242,242,247,.88); background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-bottom:.5px solid var(--sep)}
  .nav h1{margin:0; font-size:17px; font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px}
  .nav .back{display:inline-flex; align-items:center; gap:2px; font-size:17px; color:var(--blue); padding:6px 4px; background:none; border:0; white-space:nowrap}
  .nav .back svg{width:12px; height:20px}
  .nav .right{display:flex; justify-content:flex-end; align-items:center; gap:4px; font-size:15px; color:var(--sec); padding-right:4px}
  .nav .textbtn{background:none; border:0; color:var(--blue); font-size:17px; padding:6px 4px}
  .iconbtn{background:none; border:0; color:var(--blue); padding:6px; display:inline-flex}
  .iconbtn svg{width:24px; height:24px}

  .large{margin:12px 16px 12px; font-size:34px; line-height:1.15; font-weight:700; letter-spacing:-.4px}
  .pad{padding:0 16px}
  .stack>*+*{margin-top:10px}
  .center{text-align:center}
  .sec{color:var(--sec)}
  .foot{font-size:13px; color:var(--sec); margin:8px 32px 20px; line-height:1.35}
  .grow{flex:1; min-width:0}
  .t{font-size:17px; line-height:1.25}
  .s{font-size:13px; color:var(--sec); line-height:1.3}
  /* L'animazione d'ingresso vale quando si cambia schermata, non a ogni
     ridisegno. Nella demo il ridisegno avveniva solo navigando; ora ogni
     azione ricarica dal server e ridisegna, e senza la classe l'app
     ripartiva da trasparente a ogni tocco: sembrava sfarfallasse. */
  .view.entra{animation:fadeup .22s ease-out}
  /* Attesa: forme grigie con la stessa struttura di cio' che sta arrivando.
     Meglio di un cerchietto che gira — si vede gia' com'e' fatta la
     schermata, e l'attesa sembra piu' corta. Prima al loro posto c'erano i
     dati finti di Marco, che e' molto peggio: sembravano veri. */
  .osso{background:var(--fill); border-radius:10px; animation:respira 1.4s ease-in-out infinite}
  @keyframes respira{0%,100%{opacity:.55} 50%{opacity:.9}}
  .osso.riga{height:14px; margin:9px 0}
  .osso.tile{width:44px; height:44px; border-radius:12px; flex:none}
  @media (prefers-reduced-motion: reduce){ .osso{animation:none} }
  @keyframes fadeup{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  /* ---------- liste ---------- */
  .group-title{font-size:13px; color:var(--sec); text-transform:uppercase; letter-spacing:.3px; margin:22px 32px 8px}
  .group{background:var(--card); border-radius:var(--radius); margin:0 16px; overflow:hidden}
  .group-foot{font-size:13px; color:var(--sec); margin:8px 32px 0; line-height:1.35}
  .row{display:flex; align-items:center; gap:12px; min-height:48px; padding:10px 16px; position:relative; width:100%; text-align:left; background:none; border:0; color:inherit}
  .row+.row::before{content:""; position:absolute; left:16px; right:0; top:0; height:.5px; background:var(--sep)}
  .row.col{flex-direction:column; align-items:stretch; gap:6px}
  .row .line{display:flex; align-items:center; gap:10px}
  .row.link:active{background:var(--fill2)}
  .chev{width:8px; height:8px; border:solid var(--ter); border-width:2px 2px 0 0; transform:rotate(45deg); margin-right:4px; flex:none}
  .row .x{background:var(--fill); border:0; width:26px; height:26px; border-radius:50%; color:var(--sec); font-size:18px; line-height:1; flex:none}
  .row .add{background:none; border:0; color:var(--blue); font-weight:600; font-size:15px; padding:4px 0; flex:none}
  .input{flex:1; min-width:0; width:100%; border:0; background:transparent; font-size:17px; color:var(--label); outline:none; padding:0; height:28px}
  .input::placeholder{color:var(--ter)}
  .input.right{text-align:right; flex:none; width:auto}
  input[type="datetime-local"].input{color:var(--blue); font-size:15px}
  textarea.input{height:auto; resize:none; line-height:1.35; padding:4px 0}
  .emoji{font-size:24px; line-height:1; flex:none; width:32px; text-align:center}
  .emoji.big{font-size:30px; width:40px}
  .emoji.huge{font-size:44px; width:auto}

  /* ---------- controlli ---------- */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:50px; border-radius:12px; font-size:17px; font-weight:600; border:0; cursor:pointer; transition:transform .08s ease, opacity .15s ease; text-decoration:none}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--blue); color:#fff}
  .btn.tint{background:var(--blue-bg); color:var(--blue)}
  .btn.wa{background:var(--wa); color:#fff}
  .btn.plain{background:transparent; color:var(--blue); height:44px}

  },
  '🔒 Gruppo privato: si entra solo con il link d\'invito.': {
    en: '🔒 Private group — you get in only with the invite link.',
    es: '🔒 Grupo privado: solo se entra con el enlace de invitación.',

    ja: '🔒 非公開グループ：招待リンクからのみ参加できます。'

  'Fai lo stesso per il tuo gruppo': {
    en: 'Do the same for your group', es: 'Haz lo mismo con tu grupo',
    de: 'Mach das Gleiche für deine Gruppe', ja: '自分のグループでも同じように' },
  'Tocca per entrare. Ti chiederemo solo il nome.': {
    en: 'Tap to join. We’ll only ask for your name.',
    es: 'Toca para entrar. Solo te pediremos el nombre.',
    de: 'Tippen zum Beitreten. Wir fragen nur nach deinem Namen.',
    ja: 'タップして参加。お名前だけうかがいます。'

  /* -------------------------------------------------------- amici e conto */
  'Gli amici servono per invitare in fretta quando crei un gruppo. Non vedono i tuoi piani: la visibilità resta per gruppo.': {
    en: 'Friends are there so you can invite people quickly when you create a group. They don’t see your plans — visibility stays per group.',
    es: 'Los amigos sirven para invitar rápido cuando creas un grupo. No ven tus planes: la visibilidad sigue siendo por grupo.',
    de: 'Freunde sind dazu da, dass du beim Erstellen einer Gruppe schnell einladen kannst. Sie sehen deine Pläne nicht — Sichtbarkeit bleibt pro Gruppe.',
    ja: '友だちは、グループを作るときにすぐ招待するためのものです。あなたの予定は見えません。公開範囲はグループごとのままです。'
  },
  'Persone con cui hai già un gruppo o un piano. Gli amici non vedono i tuoi piani: servono solo per invitare in fretta.': {
    en: 'People you already share a group or a plan with. Friends don’t see your plans — they’re just there for quick invites.',
    es: 'Personas con las que ya compartes un grupo o un plan. Los amigos no ven tus planes: solo sirven para invitar rápido.',
    de: 'Leute, mit denen du schon eine Gruppe oder einen Plan teilst. Freunde sehen deine Pläne nicht — sie sind nur für schnelle Einladungen da.',
    ja: 'すでにグループや予定を共有している人たちです。友だちにあなたの予定は見えません。すぐ招待するためだけのものです。'
  },
  'Il nome è quello che vedono gli altri nei piani.': {
    en: 'This is the name other people see in plans.',
    es: 'Este es el nombre que los demás ven en los planes.',
    de: 'Diesen Namen sehen die anderen in den Plänen.',
    ja: '予定のなかで、ほかの人に表示される名前です。'
  },
  'Email': { en: 'Email', es: 'Correo', de: 'E-Mail', ja: 'メール' },
  'Collega i piani dal web': { en: 'Bring in your plans from the web',
    es: 'Vincula tus planes de la web', de: 'Pläne aus dem Web verbinden',
    ja: 'ウェブでの予定をつなげる' },
  'L\'email che hai usato sul web': {
    en: 'The email you used on the web', es: 'El correo que usaste en la web',
    de: 'Die E-Mail, die du im Web benutzt hast', ja: 'ウェブで使ったメールアドレス' },
  'Se hai votato da un link senza app e hai lasciato l\'email, scrivila qui: i tuoi voti e risposte passano a questo account.': {
    en: 'If you voted from a link without the app and left your email, type it here: your votes and answers move over to this account.',
    es: 'Si votaste desde un enlace sin la app y dejaste tu correo, escríbelo aquí: tus votos y respuestas pasan a esta cuenta.',
    de: 'Wenn du über einen Link ohne App abgestimmt und deine E-Mail hinterlassen hast, trag sie hier ein: Deine Stimmen und Antworten wandern zu diesem Konto.',
    ja: 'アプリなしでリンクから投票し、メールアドレスを残していた場合はここに入力してください。投票と回答がこのアカウントに移ります。'
  },
  'Nell\'app vera arriva un codice a quell\'email, per sicurezza.': {
    en: 'In the real app a code goes to that address, for safety.',
    es: 'En la app real llega un código a ese correo, por seguridad.',
    de: 'In der echten App geht ein Code an diese Adresse — zur Sicherheit.',
    ja: '実際のアプリでは、安全のためそのアドレスに確認コードが届きます。'
  },
  'Nessuna newsletter: una sola email quando viene confermato. La stessa email ti permette di ritrovare questo piano se poi installi l\'app.': {
    en: 'No newsletter — one email when it’s confirmed. That same address lets you find this plan again if you install the app later.',
    es: 'Sin newsletter: un solo correo cuando se confirme. Ese mismo correo te permite recuperar este plan si luego instalas la app.',
    de: 'Kein Newsletter — eine E-Mail, wenn es bestätigt ist. Mit derselben Adresse findest du diesen Plan wieder, falls du die App später installierst.',
    ja: 'ニュースレターはありません。確定したときに一通だけ届きます。同じアドレスで、あとからアプリを入れてもこの予定を見つけられます。'
  },
  'Ogni voce è tua. Un gruppo si silenzia dalla sua pagina (Gestisci / Info). Quello che non arriva come push resta comunque in Novità.': {
    en: 'Every setting here is yours. A group is muted from its own page (Manage / Info). Whatever doesn’t arrive as a push is still waiting in News.',
    es: 'Cada ajuste es tuyo. Un grupo se silencia desde su propia página (Gestionar / Info). Lo que no llegue como notificación sigue estando en Novedades.',
    de: 'Jede Einstellung hier gehört dir. Eine Gruppe wird auf ihrer eigenen Seite stummgeschaltet (Verwalten / Info). Was nicht als Push ankommt, wartet trotzdem unter Neues.',
    ja: 'ここの設定はすべてあなたのものです。グループはそのページ（管理／情報）から通知オフにできます。プッシュで届かなかったものも「新着」には残ります。'
  },
  'Ancora niente: quando qualcuno vota, conferma o risponde a un piano, compare qui.': {
    en: 'Nothing yet. When someone votes, confirms or replies to a plan, it shows up here.',
    es: 'Todavía nada. Cuando alguien vote, confirme o responda a un plan, aparecerá aquí.',
    de: 'Noch nichts. Sobald jemand abstimmt, bestätigt oder auf einen Plan antwortet, erscheint es hier.',
    ja: 'まだ何もありません。だれかが投票・確定・返信すると、ここに表示されます。'
  },
  '🔔 = con le tue impostazioni sarebbe arrivata una notifica.': {
    en: '🔔 = with your settings, this would have come as a notification.',
    es: '🔔 = con tus ajustes, esto habría llegado como notificación.',
    de: '🔔 = mit deinen Einstellungen wäre das als Benachrichtigung gekommen.',
    ja: '🔔 ＝ 現在の設定なら、これは通知として届いていたものです。'
  },

  'Tutto il giorno': { en: 'All day', es: 'Todo el día', de: 'Ganztägig', ja: '終日' },
  'Non so': { en: 'Not sure', es: 'No sé', de: 'Weiß nicht', ja: 'わからない' },
  'Si vota insieme a quando e dove.': {
    en: 'It’s voted on together with when and where.',
    es: 'Se vota junto con el cuándo y el dónde.',
    de: 'Wird zusammen mit Wann und Wo abgestimmt.',
    ja: '日時・場所といっしょに投票します。'
  },
  'Due bottoni, 👍 Sì e 👎 No. Il voto vale subito, vince la maggioranza di chi risponde.': {
    en: 'Two buttons, 👍 Yes and 👎 No. The vote counts straight away; whoever answers, the majority wins.',
    es: 'Dos botones, 👍 Sí y 👎 No. El voto cuenta al momento y gana la mayoría de quienes respondan.',
    de: 'Zwei Knöpfe, 👍 Ja und 👎 Nein. Die Stimme zählt sofort; es gewinnt die Mehrheit derer, die antworten.',
    ja: 'ボタンは 👍 はい と 👎 いいえ の二つ。投票はすぐ反映され、答えた人の多数決で決まります。'
  },
  'Ogni data ha il suo "ci sono". Modifiche e proposte valgono per una data sola.': {
    en: 'Each date has its own “I’m in”. Changes and suggestions apply to one date only.',
    es: 'Cada fecha tiene su propio «voy». Los cambios y las propuestas valen para una sola fecha.',
    de: 'Jedes Datum hat sein eigenes „Ich bin dabei“. Änderungen und Vorschläge gelten für ein einzelnes Datum.',
    ja: '日付ごとに「参加する」があります。変更や提案は、その日付だけに効きます。'
  },
  'Crea un piano in 30 secondi, direttamente da qui.': {
    en: 'Make a plan in 30 seconds, right from here.',
    es: 'Crea un plan en 30 segundos, directamente desde aquí.',
    de: 'Mach in 30 Sekunden einen Plan, direkt von hier.',
    ja: 'ここから 30 秒で予定を作れます。'
  },
  'Tocca "Ci sono" per rispondere: ti chiederemo solo il nome.': {
    en: 'Tap “I’m in” to answer — we’ll only ask for your name.',
    es: 'Toca «Voy» para responder: solo te pediremos el nombre.',
    de: 'Tippe auf „Ich bin dabei“ — wir fragen nur nach deinem Namen.',
    ja: '「参加する」を押して返事してください。お名前だけうかがいます。'
  },
  'Tutti lo vedono nel piano, senza cercare il messaggio in chat.': {
    en: 'Everyone sees it in the plan, without digging for the message in the chat.',
    es: 'Todos lo ven en el plan, sin buscar el mensaje en el chat.',
    de: 'Alle sehen es im Plan, ohne die Nachricht im Chat zu suchen.',
    ja: 'チャットからメッセージを探さなくても、みんなが予定の中で見られます。'
  },

  /* -------------------------------------------------- se il piano salta */
  'Se salta, dirlo qui è meglio che sparire: chi ha il link lo vede, e messaggi e spese restano.': {
    en: 'If it falls through, saying so here beats vanishing: whoever has the link sees it, and messages and expenses stay put.',
    es: 'Si se cae, decirlo aquí es mejor que desaparecer: quien tenga el enlace lo ve, y los mensajes y los gastos siguen ahí.',
    de: 'Wenn es platzt, ist es besser, das hier zu sagen, als zu verschwinden: Wer den Link hat, sieht es, und Nachrichten und Ausgaben bleiben.',
    ja: '中止になったら、黙って消えるよりここで伝えるほうが親切です。リンクを持つ人には表示され、メッセージや費用はそのまま残ります。'
  },
  'Il link resta valido: chi lo apre vede che è saltato. Messaggi e spese restano dove sono.': {
    en: 'The link still works — whoever opens it sees that it’s off. Messages and expenses stay where they are.',
    es: 'El enlace sigue siendo válido: quien lo abra verá que se ha cancelado. Los mensajes y los gastos se quedan donde están.',
    de: 'Der Link bleibt gültig — wer ihn öffnet, sieht, dass es abgesagt ist. Nachrichten und Ausgaben bleiben, wo sie sind.',
    ja: 'リンクはそのまま使えます。開いた人には中止になったことが表示されます。メッセージや費用はそのまま残ります。'
  },
  'Il tuo "ci sono" diventa "non vengo" e il gruppo lo vede subito.': {
    en: 'Your “I’m in” becomes “I’m out”, and the group sees it right away.',
    es: 'Tu «voy» pasa a «no voy» y el grupo lo ve enseguida.',
    de: 'Aus deinem „Ich bin dabei“ wird „Ich komme nicht“, und die Gruppe sieht es sofort.',
    ja: '「参加する」が「行けない」に変わり、みんなにすぐ伝わります。'
  },
  'Es. esco tardi dal lavoro': { en: 'E.g. I’m getting out of work late',
    es: 'Ej. salgo tarde del trabajo', de: 'Z.B. ich komme spät aus der Arbeit',
    ja: '例：仕事が遅くなりそう' },
  'Es. per me va bene tutto ma non troppo tardi': {

  /* ------------------------------------------------------- posti e spese */
  'Elimina posto': { en: 'Delete place', es: 'Eliminar sitio',

  '📷 Foto': { en: '📷 Photo', es: '📷 Foto', de: '📷 Foto', ja: '📷 写真' },
  'Il ristorante di sempre, il campo, la casa al mare: nome, indirizzo e allegati tuoi (il menu fotografato). Quando lo usi in un piano, gli altri vedono solo nome e indirizzo.': {

    de: 'Das Stammlokal, der Platz, das Haus am Meer: Name, Adresse und deine eigenen Anhänge (die abfotografierte Karte). Wenn du den Ort in einem Plan verwendest, sehen die anderen nur Name und Adresse.',
    ja: 'いつもの店、コート、海辺の家。名前と住所、そしてあなただけの添付（撮っておいたメニューなど）。予定で使うとき、ほかの人に見えるのは名前と住所だけです。'
  },
  '★ = copertina: è la foto che vedi in giro per l\'app e nei piani in cui usi il posto.': {
    en: '★ = cover: the photo you’ll see around the app and in the plans where you use this place.',

    de: '★ = Titelbild: das Foto, das dir in der App und in Plänen mit diesem Ort begegnet.',
    ja: '★ ＝ カバー写真。アプリのあちこちや、この場所を使った予定で表示されます。'

  'La spesa pesa solo su chi scegli: "Marco ha pagato la cena di Silvio" = paga Marco, scegli solo Silvio. Chi paga può anche non esserci.': {

    de: 'Die Ausgabe trifft nur die, die du auswählst: „Marco hat Silvios Essen bezahlt“ = Marco zahlt, du wählst nur Silvio. Wer zahlt, muss nicht dabei sein.',

  'Membro eliminato': { en: 'Deleted member', es: 'Miembro eliminado',

    de: 'Das Stammlokal, der Platz, das Haus am Meer: Name, Adresse und deine eigenen Anhänge — die Karte, das richtige Tor, der Türcode. Wenn du den Ort in einem Plan verwendest, sehen die anderen nur Name und Adresse.',
    ja: 'いつもの店、コート、海辺の家。名前と住所、そしてあなただけの添付——メニュー、正しい入口、玄関の暗証番号。予定で使うとき、ほかの人に見えるのは名前と住所だけです。'

  'Kimari segue la lingua del telefono: per cambiarla si cambia quella nelle impostazioni.': {
    en: 'Kimari follows your phone’s language: to change it, change that one in the settings.',
    es: 'Kimari sigue el idioma del teléfono: para cambiarlo, cambia ese en los ajustes.',
    de: 'Kimari folgt der Sprache deines Handys: Zum Ändern änderst du sie in den Einstellungen.',

  'Ogni piano confermato si aggiunge al calendario dalla sua pagina.': {

  /* ---------------------------------------- app: account, privacy, limiti */
  'Hai partecipato dal web?': { en: 'Did you take part from the web?',
    es: '¿Participaste desde la web?', de: 'Warst du übers Web dabei?',
    ja: 'ウェブから参加しましたか？' },
  'Niente account: il nome serve solo agli amici per sapere chi ha risposto.': {
    en: 'No account: the name is just so your friends know who answered.',
    es: 'Sin cuenta: el nombre solo sirve para que tus amigos sepan quién respondió.',
    de: 'Kein Konto: Der Name ist nur da, damit deine Freunde wissen, wer geantwortet hat.',
    ja: 'アカウントは不要です。名前は、だれが答えたかを友だちが分かるためだけのものです。'
  },
  'Eliminare l\'account cancella profilo, voti e risposte. Nei piani a cui hai partecipato resti come «Membro eliminato», così agli altri non spariscono i conti e i messaggi.': {
    en: 'Deleting your account removes your profile, votes and answers. In the plans you took part in you stay as “Deleted member”, so the others don’t lose their tallies and messages.',
    es: 'Eliminar la cuenta borra tu perfil, tus votos y tus respuestas. En los planes en los que participaste quedas como «Miembro eliminado», para que los demás no pierdan las cuentas ni los mensajes.',
    de: 'Das Löschen deines Kontos entfernt Profil, Stimmen und Antworten. In den Plänen, an denen du teilgenommen hast, bleibst du als „Gelöschtes Mitglied“, damit den anderen Abrechnungen und Nachrichten nicht verschwinden.',
    ja: 'アカウントを削除すると、プロフィール・投票・回答が消えます。参加した予定では「退会したメンバー」として残るので、ほかの人の精算やメッセージは失われません。'
  },
  'Dall\'app o dal web. Lo storico condiviso resta come «Membro eliminato».': {
    en: 'From the app or the web. Shared history stays as “Deleted member”.',
    es: 'Desde la app o la web. El historial compartido queda como «Miembro eliminado».',
    de: 'Aus der App oder im Web. Der geteilte Verlauf bleibt als „Gelöschtes Mitglied“.',
    ja: 'アプリからでもウェブからでも。共有された履歴は「退会したメンバー」として残ります。'
  },
  'Chi ha meno di 16 anni non può creare un account. Nei gruppi famiglia i nomi dei minori restano solo come nomi, senza altri dati.': {
    en: 'Under-16s can’t create an account. In family groups, children’s names stay as names only, with no other data.',
    es: 'Los menores de 16 años no pueden crear una cuenta. En los grupos familiares los nombres de los menores se quedan solo como nombres, sin más datos.',
    de: 'Unter 16 kann man kein Konto anlegen. In Familiengruppen bleiben die Namen von Kindern nur Namen, ohne weitere Daten.',
    ja: '16 歳未満の方はアカウントを作成できません。家族グループでは、お子さんの名前は名前としてだけ残り、ほかの情報は保存しません。'
  },
  'Nome, email se la dai, voti, risposte, commenti, allegati e foto che carichi. Niente rubrica, niente posizione in background.': {
    en: 'Your name, your email if you give it, votes, answers, comments, attachments and photos you upload. No address book, no background location.',
    es: 'Tu nombre, tu correo si lo das, votos, respuestas, comentarios, adjuntos y fotos que subas. Sin agenda, sin ubicación en segundo plano.',
    de: 'Dein Name, deine E-Mail falls du sie angibst, Stimmen, Antworten, Kommentare, Anhänge und Fotos, die du hochlädst. Kein Adressbuch, kein Standort im Hintergrund.',
    ja: '名前、（提供された場合は）メールアドレス、投票、回答、コメント、添付ファイル、アップロードした写真。連絡先やバックグラウンドの位置情報は取得しません。'
  },
  'Si entra solo su invito. Chi non è in un piano non ne vede nulla.': {
    en: 'You get in by invitation only. Anyone not in a plan sees nothing of it.',
    es: 'Solo se entra por invitación. Quien no está en un plan no ve nada de él.',
    de: 'Zutritt nur auf Einladung. Wer nicht in einem Plan ist, sieht nichts davon.',
    ja: '参加は招待からのみです。予定に入っていない人には、その中身は一切見えません。'
  },
  'Gli admin possono rimuovere commenti, allegati e persone. Puoi segnalare un contenuto o bloccare una persona.': {
    en: 'Admins can remove comments, attachments and people. You can report content or block a person.',
    es: 'Los admins pueden quitar comentarios, adjuntos y personas. Puedes denunciar contenido o bloquear a alguien.',
    de: 'Admins können Kommentare, Anhänge und Personen entfernen. Du kannst Inhalte melden oder jemanden blockieren.',
    ja: '管理者はコメント・添付・メンバーを削除できます。内容の報告や、特定の人のブロックもできます。'
  },
  'Cosa succede nei tuoi gruppi e nei piani in cui sei. Solo lì: chi non è in un piano non ne vede nulla. Le push le scegli tu nel Profilo; qui resta tutto.': {
    en: 'What’s happening in your groups and the plans you’re in. Only there: anyone not in a plan sees nothing of it. You choose the push notifications in your Profile; here everything stays.',
    es: 'Lo que pasa en tus grupos y en los planes en los que estás. Solo ahí: quien no está en un plan no ve nada de él. Las notificaciones las eliges tú en el Perfil; aquí se queda todo.',
    de: 'Was in deinen Gruppen und den Plänen passiert, in denen du bist. Nur dort: Wer nicht in einem Plan ist, sieht nichts davon. Die Push-Nachrichten wählst du im Profil; hier bleibt alles.',
    ja: 'あなたのグループと、参加している予定での出来事です。そこだけ——予定に入っていない人には何も見えません。プッシュ通知はプロフィールで選べます。ここにはすべて残ります。'
  },
  'I limiti valgono per piano e li sblocca l\'Unlimited di chi organizza: paga uno, respira tutto il gruppo.': {
    en: 'The limits apply per plan and are lifted by the organiser’s Unlimited: one person pays, the whole group breathes.',
    es: 'Los límites son por plan y los desbloquea el Unlimited de quien organiza: paga uno, respira todo el grupo.',
    de: 'Die Grenzen gelten pro Plan und werden vom Unlimited der organisierenden Person aufgehoben: Einer zahlt, die ganze Gruppe atmet auf.',
    ja: '上限は予定ごとで、幹事の Unlimited で解除されます。ひとりが払えば、グループ全員が楽になります。'
  },
  '4,99 € una volta · un solo piano con limiti Unlimited: matrimoni, feste grandi, viaggi': {
    en: '€4.99 once · a single plan with Unlimited limits: weddings, big parties, trips',
    es: '4,99 € una vez · un solo plan con límites Unlimited: bodas, fiestas grandes, viajes',
    de: '4,99 € einmalig · ein einzelner Plan mit Unlimited-Grenzen: Hochzeiten, große Feste, Reisen',
    ja: '4,99 ユーロ 一回きり · 予定ひとつだけ Unlimited の上限に：結婚式、大きなパーティー、旅行'
  },

    ja: 'セクション（ローマ、バーリなど）はあなただけのもので、グループを整理するためのものです。ほかの人には見えません。グループはすべて非公開で、招待からのみ参加できます。'

    de: 'Web-Version: Wer den Link bekommt, kommt rein, tippt einen Namen und stimmt ab. Die App mit Kalender und Gruppen ist für die, die organisieren.',
    ja: 'ウェブ版：リンクを受け取った人が開いて、名前を書いて投票します。カレンダーとグループのあるアプリは、幹事のためのものです。'
  },
  'Nessun gruppo ancora. Creane uno per la famiglia, gli amici o il prossimo viaggio.': {

// Normalizza anche gli apostrofi e le virgolette tipografiche: nel codice si
// scrive "un'opinione" con l'apostrofo dritto, nei testi curati viene naturale
// scrivere "un’opinione". Sono due caratteri diversi, e senza questo la voce
// non verrebbe mai trovata — senza errori, senza avvisi: uscirebbe l'italiano
// e nessuno capirebbe perché.
const NORM = s => String(s)
  .replace(/[‘’ʼ]/g, "'")
  .replace(/[“”]/g, '"')
  .replace(/\s+/g, ' ')
  .trim();

// Indice normalizzato: nel codice le stringhe vanno a capo dentro i template,
// e "Segna tutte\n  le opzioni" deve trovare la stessa voce di "Segna tutte le
// opzioni".
const INDICE = new Map(Object.entries(DIZIONARIO).map(([k, v]) => [NORM(k), v]));

function scegliLingua(preferite, forzata) {
  if (forzata && LINGUE[forzata]) return forzata;
  for (const p of (preferite || [])) {
    const due = String(p).slice(0, 2).toLowerCase();
    if (LINGUE[due]) return due;
  }
  return 'it';
}

// Torna una funzione t() legata a una lingua. Se la voce manca, o manca quella
// lingua, esce l'italiano: mai una chiave a video, mai una stringa vuota.
function traduttore(lingua) {
  return function t(testo, valori) {
    const voce = lingua === 'it' ? null : INDICE.get(NORM(testo));
    let out = (voce && voce[lingua]) || testo;
    // I segnaposto si sostituiscono DOPO aver scelto la lingua, così ogni
    // lingua può metterli dove le servono.
    if (valori) {
      for (const k of Object.keys(valori)) out = out.split('{' + k + '}').join(String(valori[k]));
    }
    return out;
  };
}

const quanteMancano = lingua =>
  Object.values(DIZIONARIO).filter(v => !v[lingua]).length;

// La lingua è quella del dispositivo: nessun selettore da cercare, e chi
// riceve il link da un amico all'estero legge nella sua lingua senza fare niente.
const LINGUA = scegliLingua(navigator.languages || [navigator.language]);
const t = traduttore(LINGUA);
document.documentElement.lang = LINGUA;

<script>
(() => {
'use strict';

/* =============================== utilità =============================== */
const $ = (s, r = document) => r.querySelector(s);
// Marcatura scritta da live.js quando esiste un profilo: dice a questo file,
// che parte per primo, di non riproporre l'ingresso a chi e' gia' dentro.
const giaEntrato = () => { try { return localStorage.getItem('kimari_profilo') === '1'; } catch(_) { return false; } };
const uid = () => Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const pad = n => String(n).padStart(2, '0');
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const dayDiff = (a, b) => Math.round((dayStart(b) - dayStart(a)) / 864e5);
function nextDow(dow, h, m = 0){ const d = new Date(); d.setSeconds(0,0); const diff = ((dow - d.getDay() + 7) % 7) || 7; d.setDate(d.getDate() + diff); d.setHours(h, m, 0, 0); return d; }
const at = (days, h = 0, m = 0) => { const d = dayStart(new Date()); d.setDate(d.getDate() + days); d.setHours(h, m, 0, 0); return toLocalInput(d); };
// LINGUA, non 'it-IT'. Regola 4: le date le fa il dispositivo, mai stringhe a
// mano — e "il dispositivo" vuol dire la lingua che l'interfaccia ha scelto,
// se no si finisce con testo inglese e "Mercoledi 26 agosto" nella stessa
// schermata. Il FUSO resta quello del telefono, che e' sempre giusto: e' l'ora
// a cui quella persona deve presentarsi.
const fDay = new Intl.DateTimeFormat(LINGUA, { weekday:'short', day:'numeric', month:'short' });
const fTime = new Intl.DateTimeFormat(LINGUA, { hour:'2-digit', minute:'2-digit' });
const fFull = new Intl.DateTimeFormat(LINGUA, { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
const fMonth = new Intl.DateTimeFormat(LINGUA, { month:'long', year:'numeric' });
const fWeekday = new Intl.DateTimeFormat(LINGUA, { weekday:'long' });
// Le iniziali della settimana erano scritte a mano: L M M G V S D. In inglese
// e in giapponese non vogliono dire niente. Si ricavano dalla lingua, partendo
// da un lunedi' vero (5 gennaio 2026).
const INIZIALI_GIORNI = (() => {
  const f = new Intl.DateTimeFormat(LINGUA, { weekday: 'narrow' });
  return Array.from({ length: 7 }, (_, i) => f.format(new Date(2026, 0, 5 + i)));
})();
function fmtWhen(w){

    p.expenses.forEach(e => { e.by = sw(e.by); e.among = [...new Set(e.among.map(sw))]; }); p.settlements.forEach(s => { s.from = sw(s.from); s.to = sw(s.to); });
    p.proposals.forEach(pr => { pr.by = sw(pr.by); pr.eligible = [...new Set(pr.eligible.map(sw))]; if(pr.votes[webId]){ pr.votes[appId] = pr.votes[appId] || pr.votes[webId]; delete pr.votes[webId]; } });
  });
  delete state.people[webId]; return n;
}

function feedItems(){
  const items = [];

  // sapeva se qualcuno l'avesse aperto. Segnalato da Vincenzo il 27/8.
  Object.values(state.groups).forEach(g => {

    });
  });
  visiblePlans().forEach(p => {
    const g = groupOf(p);
    p.changes.forEach(c => { if(c.kind === 'created') items.push({ at:c.at, by:c.by, text: p.kind === 'decision' ? t('ha aperto una decisione') : t('ha creato un piano'), p, g, cat: p.status === 'deciding' ? 'vote' : 'confirm' }); if(c.kind === 'confirmed') items.push({ at:c.at, by:c.by, text:`ha ${p.kind === 'decision' ? 'chiuso la decisione' : 'confermato'}: ${c.text.replace(/^(Confermato|Deciso): /,'')}`, p, g, cat:'confirm' }); if(c.kind === 'changed') items.push({ at:c.at, by:c.by, text:`ha modificato il piano · ${c.text}`, p, g, cat:'change' }); if(c.kind === 'cancelled') items.push({ at:c.at, by:c.by, text: decisioneOPiano(p) + ' · ' + c.text, p, g, cat:'change' }); });
    Object.entries(p.ballots).forEach(([id, b]) => items.push({ at:b.at || p.createdAt, by:id, text:'ha votato', p, g, cat:'group' }));
    p.participants.forEach(x => { if(x.rsvp && x.rsvpAt) items.push({ at:x.rsvpAt, by:x.id, text: x.rsvp === 'yes' ? t('ci sarà') : x.rsvp === 'maybe' ? t('forse ci sarà') : t('non viene'), p, g, cat:'group' }); });
    p.comments.forEach(c => { if(c.system){ const cat = { late:'late', absent:'late', proposal:'proposal', proposal_ok:'proposal', proposal_no:'proposal', candidate:'vote', photo:'media', expense:'expense' }[c.kind]; if(cat) items.push({ at:c.at, by:c.by, text:c.text, p, g, cat, raw:true }); } else items.push({ at:c.at, by:c.by, text:`ha commentato: “${c.text.slice(0, 60)}${c.text.length > 60 ? '…' : ''}”`, p, g, cat:'comment' }); });
  });

}

/* =============================== calendario =============================== */
function monthGrid(y, m){
  const first = new Date(y, m, 1); const startDow = (first.getDay() + 6) % 7; const n = new Date(y, m+1, 0).getDate();
  const cells = []; for(let i = 0; i < startDow; i++) cells.push(null); for(let d = 1; d <= n; d++) cells.push(new Date(y, m, d)); while(cells.length % 7) cells.push(null);
  const weeks = []; for(let i = 0; i < cells.length; i += 7) weeks.push({ col0:addDays(first, i - startDow), days:cells.slice(i, i+7) }); return weeks;
}
function calItems(){
  const byDay = {}, bars = []; const push = (k, it) => { (byDay[k] = byDay[k] || []).push(it); };
  visiblePlans().forEach(p => {
    const g = groupOf(p); const col = g ? g.color : '#007AFF';
    if(p.status === 'confirmed' && p.when.value && p.when.value.start){
      const s = dayStart(new Date(p.when.value.start)); const e = p.when.value.end ? dayStart(new Date(p.when.value.end)) : s;
      if(dayDiff(s, e) > 0) bars.push({ p, from:s, to:e, color:col, time: p.when.value.allDay ? t('Più giorni') : fTime.format(new Date(p.when.value.start)) });
      else push(dkey(s), { p, kind:'dot', color:col, time: p.when.value.allDay ? 'Tutto il giorno' : fTime.format(new Date(p.when.value.start)) });
    } else if(p.status === 'deciding'){ p.when.candidates.forEach(c => push(dkey(new Date(c.start)), { p, kind:'ring', color:'#FF9500', time: c.allDay ? 'Opzione' : fTime.format(new Date(c.start)) })); }
  });
  return { byDay, bars };
}
function vCalendar(){
  const { y, m } = state.cal; const weeks = monthGrid(y, m); const items = calItems(); const todayKey = dkey(new Date());
  return `<section class="cal" aria-label="${t('Calendario')}">
    <div class="cal-head"><div class="cal-title">${cap(fMonth.format(new Date(y, m, 1)))}</div><button class="cal-today" data-action="calToday">${t('Oggi')}</button><button class="cal-nav" data-action="calPrev" aria-label="${t('Mese precedente')}">${ICON.chevL}</button><button class="cal-nav" data-action="calNext" aria-label="${t('Mese successivo')}">${ICON.chevR}</button></div>
    <div class="cal-dow">${INIZIALI_GIORNI.map(d => `<span>${d}</span>`).join('')}</div>
    ${weeks.map(w => {
      const col6 = addDays(w.col0, 6);
      const bars = items.bars.map(b => { const bs = b.from > w.col0 ? b.from : w.col0; const be = b.to < col6 ? b.to : col6; if(bs > be) return null; return { b, start:dayDiff(w.col0, bs), span:dayDiff(bs, be) + 1 }; }).filter(Boolean).slice(0, 2);
      return `<div class="cal-week">${w.days.map(d => { if(!d) return '<div class="cal-day"></div>'; const k = dkey(d); const dots = (items.byDay[k] || []).slice(0, 3);
        return `<button class="cal-day ${k < todayKey ? 'past' : ''}" data-action="selDay" data-d="${k}" aria-label="${d.getDate()}"><span class="num ${k === todayKey ? 'today' : ''} ${k === state.selDay ? 'sel' : ''}">${d.getDate()}</span><span class="dots">${dots.map(x => `<i class="dot ${x.kind === 'ring' ? 'ring' : ''}" style="${x.kind === 'ring' ? '' : 'background:' + x.color}"></i>`).join('')}</span></button>`; }).join('')}
      ${bars.map((x, i) => `<button class="cal-bar" style="left:calc(${x.start / 7 * 100}% + 3px);width:calc(${x.span / 7 * 100}% - 6px);background:${x.b.color};bottom:${4 + i * 7}px" data-action="go" data-to="p/${x.b.p.id}" aria-label="${esc(x.b.p.title)}"></button>`).join('')}</div>`;
    }).join('')}
  </section>`;
}
function vAgenda(){

  const list = [...(items.byDay[k] || []), ...items.bars.filter(b => dkey(b.from) <= k && dkey(b.to) >= k).map(b => ({ p:b.p, kind:'bar', color:b.color, time:b.time }))];

// Chi e' entrato col solo nome vive in QUESTO browser: niente account a cui
// riagganciarsi. Se svuota i dati o cambia telefono, perde i piani e non c'e'
// modo di recuperarli. Aggiungere alla schermata Home non e' un consiglio
// estetico — e' l'unica protezione che ha. E' anche l'unico modo di ricevere
// notifiche su iPhone.
//
// Si mostra DOPO che ha fatto qualcosa (ha un gruppo o un piano), non subito:
// al primo ingresso uno vuole entrare, non leggere consigli. E si puo'
// chiudere: un avviso che non si chiude e' una molestia, e chi lo chiude ha
// gia' capito.
// Sa gia' se e' installata, e come installarla. Le due piattaforme sono
// diverse in modo che conta:
//   Android  il browser puo' aprire una VERA finestra di installazione, con un
//            tocco. Basta averne conservato l'invito (beforeinstallprompt).
//   iPhone   quell'API non esiste. Si possono solo dare istruzioni, e solo
//            Safari sa farlo: da Chrome su iPhone "Aggiungi a Home" non c'e'
//            proprio, e dare istruzioni che non si possono seguire e' peggio
//            che tacere.
let invitoInstalla = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();          // niente banner del browser: lo chiediamo noi, al momento giusto
  invitoInstalla = e;
  if(typeof render === 'function') render();
});

// matchMedia non esiste ovunque — in jsdom no, e su qualche browser vecchio
// nemmeno. Chiamarlo senza rete di sicurezza faceva morire render(), e con lui
// l'app intera: schermata bianca. Nel dubbio si risponde "non installata",
// che al massimo mostra un suggerimento di troppo.
const installata = () => {
  try {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        || navigator.standalone === true;
  } catch(_) { return false; }
};

function suggerimentoHome(){
  if(state.tipHomeChiuso) return '';
  if(installata()) return '';
  if(state.me === 'guest' || !me()) return '';
  if(!Object.keys(state.groups).length && !Object.keys(state.plans).length) return '';

  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  // Su iPhone solo Safari sa aggiungere alla schermata Home. Da Chrome o
  // Firefox quel comando non esiste, e dare istruzioni che non si possono
  // seguire fa sembrare rotta l'app invece del browser.
  const safariIOS = iOS && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);

  const come = invitoInstalla
    ? `<div class="actions" style="margin-top:10px"><button class="btn primary" data-action="installa">${t('Installa')}</button></div>`
    : `<div class="s" style="margin-top:8px;opacity:.75">${
        iOS ? (safariIOS
                ? t('Tocca Condividi in basso, poi "Aggiungi a Home".')
                : t('Su iPhone serve Safari: apri kimariapp.com con Safari, poi Condividi e "Aggiungi a Home".'))
            : t('Apri il menu del browser, poi "Installa app".')}</div>`;

  return `<div class="pad" style="padding-top:12px"><div class="card" style="padding:14px">
    <div style="font-weight:600">${t('Tieni Kimari a portata di mano')}</div>
    <div class="s" style="margin-top:4px">${t('Aggiungila alla schermata Home: ricevi le notifiche dei piani nuovi, e non perdi i tuoi piani se cambi browser.')}</div>
    ${come}

  </div></div>`;
}

  <div class="group"><div class="row"><input class="input" id="xq" placeholder="${d.binary ? 'Es. Portiamo i bambini?' : 'Es. Cosa portiamo?'}" value="${esc(d.question)}" data-xbind="question" maxlength="80"></div></div>
  ${d.binary ? '<div class="group-foot">Due bottoni, Sì e No.</div>' : `<div class="group-title">Opzioni · ${d.options.length} di 5</div><div class="group">${d.options.map((o, i) => `<div class="row"><span class="chk on" style="background:var(--fill);border-color:var(--fill)"></span><div class="grow t">${esc(o)}</div><button class="x" data-action="rmXOpt" data-i="${i}" aria-label="${t('Rimuovi')}">×</button></div>`).join('')}${d.options.length < 5 ? `<div class="row"><input class="input" id="xopt" placeholder="${t('Un\'opzione')}" maxlength="40"><button class="add" data-action="addXOpt">${t('Aggiungi')}</button></div>` : ''}</div>`}
  <div class="actions"><button class="btn primary" data-action="saveExtra">${t('Aggiungi al piano')}</button></div>`;

/* =============================== render =============================== */
function route(){ const h = location.hash.replace(/^#\/?/, ''); const [name, arg] = h.split('/'); return { name: name || 'home', arg }; }
function go(h){ if(location.hash === '#' + h) render(); else location.hash = h; }
function planByRoute(r){ if(r.name === 'p' || r.name === 'share') return state.plans[r.arg]; if(r.name === 'i') return Object.values(state.plans).find(p => p.token === r.arg); return null; }
function renderDevbar(){
  const sel = $('#who');
  sel.innerHTML = Object.values(state.people).filter(p => !p.web).map(p => `<option value="${p.id}" ${state.me === p.id ? 'selected' : ''}>${esc(p.name)} (app)</option>`).join('')
    + Object.values(state.people).filter(p => p.web).map(p => `<option value="${p.id}" ${state.me === p.id ? 'selected' : ''}>${esc(p.name)} (web)</option>`).join('')
    + `<option value="guest" ${state.me === 'guest' ? 'selected' : ''}>${t('＋ Nuovo ospite (web)')}</option>`;
}
// Aggiorna il DOM al posto di rifarlo. Serve perché ogni azione che salva
// ridisegna tutto: misurando un tocco su "Forse" si vedeva la pagina aspettare
// 719 ms e poi sostituire 40.073 caratteri di DOM per cambiarne 2, buttando e
// ricreando anche le 7 immagini. Le immagini sono base64 e non passano dalla
// rete, ma vengono comunque ridecodificate e ridisegnate: è quello lo
// sfarfallio che si vede sul telefono.
//
// Qui si scende in parallelo nei due alberi e si tocca solo ciò che differisce.
// Non serve una libreria: il prototipo ascolta i click su document, quindi
// nessun nodo porta ascoltatori da preservare.
function aggiorna(vecchio, nuovoHtml){
  const tmp = document.createElement('div');
  tmp.innerHTML = nuovoHtml;
  sincronizza(vecchio, tmp);
}
function sincronizza(a, b){
  const fa = a.childNodes, fb = b.childNodes;
  // Coda in eccesso: si toglie dal fondo, così gli indici davanti non ballano.
  while(fa.length > fb.length) a.removeChild(a.lastChild);
  for(let i = 0; i < fb.length; i++){
    const vn = fa[i], nn = fb[i];
    if(!vn){ a.appendChild(nn.cloneNode(true)); continue; }
    if(vn.nodeType !== nn.nodeType || vn.nodeName !== nn.nodeName){
      a.replaceChild(nn.cloneNode(true), vn); continue;
    }
    if(vn.nodeType === 3){                                          // testo
      if(vn.nodeValue !== nn.nodeValue) vn.nodeValue = nn.nodeValue;
      continue;
    }
    if(vn.nodeType !== 1) continue;
    // attributi: solo quelli che cambiano davvero
    for(const at of [...nn.attributes]){
      if(vn.getAttribute(at.name) !== at.value) vn.setAttribute(at.name, at.value);
    }
    for(const at of [...vn.attributes]){
      if(!nn.hasAttribute(at.name)) vn.removeAttribute(at.name);
    }
    // I campi hanno un valore che vive nella proprietà, non nell'attributo:
    // senza questo, svuotare una casella dopo averla salvata non funziona.
    if(vn.nodeName === 'INPUT' || vn.nodeName === 'TEXTAREA'){
      const nuovo = vn.nodeName === 'TEXTAREA' ? nn.textContent : (nn.getAttribute('value') || '');
      if(vn.value !== nuovo) vn.value = nuovo;
      if(vn.type === 'checkbox' || vn.type === 'radio') vn.checked = nn.hasAttribute('checked');
    }
    sincronizza(vn, nn);
  }
}

function render(){
  const kk = (location.hash.replace('#','') || 'home').split('/')[0];
  if(state._lastRoute !== location.hash){ state._lastRoute = location.hash; state.visits = state.visits || {}; state.visits[kk] = (state.visits[kk] || 0) + 1; }
  curRoute = kk;
  const r = route(); const prev = $('#screen');
  // Stessa schermata ridisegnata (un salvataggio, una ricarica dai dati veri)
  // oppure schermata nuova? Da qui dipendono due cose che sembrano diverse ma
  // sono la stessa: tenere la posizione dello scorrimento, e non rigiocare
  // l'animazione d'ingresso.
  const stessaRotta = !!prev && state.lastRoute === location.hash;
  const keep = stessaRotta ? prev.scrollTop : 0;
  let html = '', tab = 'home', showTab = !isWeb();
  if(r.name === 'new'){ if(!state.draft) state.draft = newDraft(); html = vNew(); tab = 'new'; showTab = false; }
  else if(r.name === 'share'){ const p = planByRoute(r); html = p ? vShare(p) : vInvalid(); showTab = false; }
  else if(r.name === 'p' || r.name === 'i'){ const p = planByRoute(r); if(p) state.currentPlan = p.id; html = p ? vPlan(p) : vInvalid(); }
  else if(r.name === 'g' && !isWeb()){ const g = state.groups[r.arg]; html = g ? vGroup(g) : vHome(); }
  else if(r.name === 'news' && !isWeb()){ html = vNews(); tab = 'news'; }
  else if(r.name === 'profile' && !isWeb()){ html = vProfile(); tab = 'profile'; }
  else html = vHome();
  if(r.name === 'news' && !isWeb()) state.lastSeenNews = Date.now();
  // Senza rete si guarda una COPIA. Va detto sempre e in cima, non una volta
  // sola: chi apre l'app in metropolitana deve sapere che i voti degli altri
  // potrebbero essere gia' cambiati. Una copia scambiata per lo stato vero e'
  // esattamente il tipo di schermo che mente.
  const avviso = state.senzaRete
    ? `<div class="pad" style="padding-top:10px"><div class="card" style="background:var(--fill);text-align:center;padding:10px 12px">
         <div class="s">${t('Senza rete: stai guardando una copia')}</div>
         <div class="s" style="opacity:.7">${state.copiaDel ? t('Aggiornata {quando}', { quando: new Date(state.copiaDel).toLocaleString(LINGUA) }) : ''}</div>
       </div></div>`
    : '';
  // Il suggerimento di installare sta QUI e non dentro vHome: cosi' compare
  // sopra a qualunque schermata, ma sotto la barra in alto e sotto l'avviso di
  // "senza rete", che e' piu' urgente.
  const tipHome = (r.name !== 'new' && !isWeb()) ? suggerimentoHome() : '';
  aggiorna($('#app'), `<div class="screen" id="screen">${avviso}${tipHome}${html}</div>${showTab ? tabbar(tab) : ''}`);
  if(!stessaRotta) $('#app').querySelectorAll('.view').forEach(v => v.classList.add('entra'));
  $('#screen').scrollTop = keep; state.lastRoute = location.hash; renderDevbar();
  // giaEntrato() legge una marcatura lasciata da live.js: senza, questo render
  // — che parte col caricamento, prima che live.js esista — programmerebbe il
  // benvenuto anche a chi ha gia' un profilo, e chiuderlo dopo sarebbe una
  // corsa contro questo setTimeout.
  if(!isWeb() && !state.consented && !state.welcomeShown && !giaEntrato()){ state.welcomeShown = true; setTimeout(() => openSheet(sheetWelcome()), 60); }
}

/* =============================== azioni =============================== */
function setPath(obj, path, val){ const ks = path.split('.'); let o = obj; ks.slice(0,-1).forEach(k => { o = o[k]; }); o[ks[ks.length-1]] = val; }
const parseWhen = (start, end, allDay) => start ? { id:uid(), start, end:end || '', allDay:!!allDay } : null;
function afterJoin(p){
  state.ballotDraft = null; state.bdKey = null; state.justVoted = false; const t = state.pendingTap; state.pendingTap = null;
  if(t && t.field){ const bd = ensureBallotDraft(p); if(t.id) bd[t.field].approved.add(t.id); else bd[t.field].noneOk = true; }
  if(t && typeof t.rsvp === 'number'){ const m = p.participants.find(x => x.id === state.me); if(m){ m.rsvp = ['yes','maybe','no'][t.rsvp]; m.rsvpAt = Date.now(); } }
  toast(`Ciao ${nameOf(state.me)}!`); go(`p/${p.id}`);
}
function switchPersona(v){
  const p = state.plans[state.currentPlan]; state.justVoted = false; state.ballotDraft = null; state.bdKey = null;
  if(v === 'guest'){ state.me = 'guest'; go(p ? `i/${p.token}` : 'home'); return; }
  state.me = v; if(isWeb()){ go(p && p.participants.some(x => x.id === v) ? `p/${p.id}` : 'home'); } else go('home');

const msgSheet = (title, sub, text, p, pv) => openSheet(sheetMessage(title, sub, text, p, pv));
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.bind && state.draft){ setPath(state.draft, el.dataset.bind, el.value); if(el.dataset.bind === 'whereFixed.name') state.draft.whereFixed.photo = ''; }
  if(el.dataset.gbind && state.gdraft) state.gdraft[el.dataset.gbind] = el.value;
  if(el.dataset.dbind && state.ddraft) state.ddraft[el.dataset.dbind] = el.value;

  if(el.dataset.plbind && state.placeId){ const pl = me().places.find(x => x.id === state.placeId); if(pl) pl[el.dataset.plbind] = el.value; }
});
$('#who').addEventListener('change', e => switchPersona(e.target.value));
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action, d = state.draft, p = state.plans[state.currentPlan], gd = state.gdraft;
  switch(a){
    case 'noop': break;
    case 'go': if(el.dataset.to === 'cancel'){ state.draft = null; go(state.newFrom.replace(/^#/, '') || 'home'); } else go(el.dataset.to); break;
    case 'tab': if(el.dataset.to === 'new'){ state.newFrom = location.hash || '#home'; state.draft = newDraft(); } go(el.dataset.to); break;
    case 'closeSheet': closeSheet(); break;
    case 'toast': toast(el.dataset.msg); break;
    case 'reset': if(confirm(t('Ricominciare da zero? Il prototipo non salva nulla.'))){ reset(); go('home'); } break;

    /* benvenuto / termini */
    case 'ageOk': state.ageOk = !state.ageOk; openSheet(sheetWelcome()); break;
    case 'login': if(!state.ageOk){ toast(t('Conferma di avere almeno 16 anni')); break; } state.consented = true; closeSheet(); toast(`Benvenuto, ${nameOf(state.me)}`); break;
    case 'termsSheet': openSheet(sheetTerms()); break;

    /* calendario */
    case 'calPrev': { let { y, m } = state.cal; m--; if(m < 0){ m = 11; y--; } state.cal = { y, m }; render(); break; }
    case 'calNext': { let { y, m } = state.cal; m++; if(m > 11){ m = 0; y++; } state.cal = { y, m }; render(); break; }
    case 'calToday': { const n = new Date(); state.cal = { y:n.getFullYear(), m:n.getMonth() }; state.selDay = dkey(n); render(); break; }
    case 'selDay': state.selDay = el.dataset.d; render(); break;

    /* gruppi */
    case 'editSection': { const sec = me().sections.find(x => x.id === el.dataset.s); if(sec) openSheet(sheetSection(sec)); break; }
    case 'saveSection': { const v = $('#secName').value.trim(); if(!v){ toast(t('Scrivi il nome della sezione')); break; } const sec = me().sections.find(x => x.id === el.dataset.s); if(sec) sec.name = v; closeSheet(); render(); toast(t('Sezione rinominata')); break; }
    case 'delSection': { const u = me(); u.sections = u.sections.filter(x => x.id !== el.dataset.s); Object.keys(u.groupSections).forEach(g => { if(u.groupSections[g] === el.dataset.s) delete u.groupSections[g]; }); closeSheet(); render(); toast(t('Sezione eliminata')); break; }
    case 'chiudiTipHome': state.tipHomeChiuso = true; try{ localStorage.setItem('kimari_tip_home','1'); }catch(_){} render(); break;
    // L'invito si puo' usare UNA volta sola: dopo, il browser non lo ridà.
    case 'installa': if(invitoInstalla){ const inv = invitoInstalla; invitoInstalla = null; inv.prompt(); inv.userChoice.then(() => render()); } break;
    case 'newGroup': state.gdraft = { id:null, name:'', emoji:'🎉', color:'#007AFF', sectionId: me().sections[0] ? me().sections[0].id : '', newSection:'', members:new Set() }; openSheet(sheetGroup()); break;
    case 'editGroup': { const g = state.groups[el.dataset.g]; state.gdraft = { id:g.id, name:g.name, emoji:g.emoji, color:g.color, sectionId: me().groupSections[g.id] || '', newSection:'', members:new Set() }; openSheet(sheetGroup()); break; }
    case 'gEmoji': gd.emoji = el.dataset.v; openSheet(sheetGroup()); break;
    case 'gColor': gd.color = el.dataset.v; openSheet(sheetGroup()); break;
    case 'gSection': gd.sectionId = el.dataset.v; openSheet(sheetGroup()); break;
    case 'gMember': gd.members.has(el.dataset.v) ? gd.members.delete(el.dataset.v) : gd.members.add(el.dataset.v); openSheet(sheetGroup()); break;
    case 'saveGroup': {
      if(!gd.name.trim()){ toast('Dai un nome al gruppo'); break; } const u = me(); let sectionId = gd.sectionId;
      if(sectionId === 'new'){ if(!gd.newSection.trim()){ toast('Scrivi il nome della sezione'); break; } const s = { id:uid(), name:gd.newSection.trim() }; u.sections.push(s); sectionId = s.id; }
      if(gd.id){ Object.assign(state.groups[gd.id], { name:gd.name.trim(), emoji:gd.emoji, color:gd.color }); if(sectionId) u.groupSections[gd.id] = sectionId; else delete u.groupSections[gd.id]; closeSheet(); toast(t('Gruppo aggiornato')); render(); }
      else { const id = uid(); state.groups[id] = { id, name:gd.name.trim(), emoji:gd.emoji, color:gd.color, members:[state.me, ...gd.members], createdBy:state.me, admins:[state.me], createdAt:Date.now() }; if(sectionId) u.groupSections[id] = sectionId; closeSheet(); toast(t('Gruppo creato · privato, solo su invito')); go(`g/${id}`); }
      break;
    }
    case 'manageGroup': openSheet(sheetManage(state.groups[el.dataset.g])); break;
    case 'muteGroup': { const u = me(); const gid = el.dataset.g; u.muted = u.muted.includes(gid) ? u.muted.filter(x => x !== gid) : [...u.muted, gid]; openSheet(sheetManage(state.groups[gid])); break; }
    case 'revokeLink': toast('Link revocato: chi è già dentro resta'); break;
    case 'toggleAdmin': { const g = state.groups[el.dataset.g]; const id = el.dataset.id; g.admins = g.admins.includes(id) ? g.admins.filter(x => x !== id) : [...g.admins, id]; openSheet(sheetManage(g)); break; }
    case 'removeMember': { const g = state.groups[el.dataset.g]; removeMemberFromGroup(g, el.dataset.id); toast(`${nameOf(el.dataset.id)} rimosso dal gruppo`); openSheet(sheetManage(g)); render(); break; }
    case 'transferOwner': { const g = state.groups[el.dataset.g]; g.createdBy = el.dataset.id; if(!g.admins.includes(el.dataset.id)) g.admins.push(el.dataset.id); toast(`${nameOf(el.dataset.id)} è il nuovo creatore`); openSheet(sheetManage(g)); render(); break; }
    case 'leaveGroup': { const g = state.groups[el.dataset.g]; removeMemberFromGroup(g, state.me); closeSheet(); toast(`Sei uscito da ${g.name}`); go('home'); break; }
    case 'deleteGroup': { if(!confirm(t('Eliminare il gruppo e i suoi piani? Non si torna indietro.'))) break; const gid = el.dataset.g; Object.values(state.plans).filter(x => x.groupId === gid).forEach(x => delete state.plans[x.id]); delete state.groups[gid]; closeSheet(); toast(t('Gruppo eliminato')); go('home'); break; }
    case 'newInGroup': state.newFrom = location.hash; state.draft = newDraft(el.dataset.g); go('new'); break;
    case 'inviteGroup': { const g = state.groups[el.dataset.g]; msgSheet(t('Invita nel gruppo'), t('Il gruppo è privato: si entra solo con questo link, che puoi revocare.'), msgs.group(g), { emoji:g.emoji, title:g.name }, `${g.members.length} persone · Kimari`); break; }
    case 'setGroup': d.groupId = el.dataset.g; render(); break;

    /* decisione secca */
    case 'newDecision': state.ddraft = { groupId:el.dataset.g, question:'', options:[], binary:true }; openSheet(sheetDecision(state.groups[el.dataset.g])); break;
    case 'dBinary': state.ddraft.binary = el.dataset.v === '1'; openSheet(sheetDecision(state.groups[state.ddraft.groupId])); break;
    case 'xBinary': state.xdraft.binary = el.dataset.v === '1'; openSheet(sheetExtra()); break;
    case 'addDOpt': { const v = $('#dopt').value.trim(); if(!v){ toast("Scrivi un'opzione"); break; } if(state.ddraft.options.some(o => o.toLowerCase() === v.toLowerCase())){ toast(t('Già tra le opzioni')); break; } state.ddraft.options.push(v); openSheet(sheetDecision(state.groups[state.ddraft.groupId])); break; }
    case 'rmDOpt': state.ddraft.options.splice(+el.dataset.i, 1); openSheet(sheetDecision(state.groups[state.ddraft.groupId])); break;
    case 'dPreset': state.ddraft.options = el.dataset.v.split('|'); openSheet(sheetDecision(state.groups[state.ddraft.groupId])); break;
    case 'saveDecision': { const dd = state.ddraft; if(!dd.question.trim()){ toast('Scrivi la domanda'); break; } if(!dd.binary && dd.options.length < 2){ toast('Servono almeno 2 opzioni'); break; } const np = createDecision(state.groups[dd.groupId], dd.question.trim(), dd.options, dd.binary); closeSheet(); state.ddraft = null; go(`p/${np.id}`); break; }

    case 'addXOpt': { const v = $('#xopt').value.trim(); if(!v){ toast("Scrivi un'opzione"); break; } state.xdraft.options.push(v); openSheet(sheetExtra()); break; }
    case 'rmXOpt': state.xdraft.options.splice(+el.dataset.i, 1); openSheet(sheetExtra()); break;
    case 'saveExtra': { const x = state.xdraft; if(!x.question.trim()){ toast('Scrivi la domanda'); break; } if(!x.binary && x.options.length < 2){ toast('Servono almeno 2 opzioni'); break; } d.extras.push({ question:x.question.trim(), options:[...x.options], binary:!!x.binary }); closeSheet(); render(); break; }
    case 'rmExtra': d.extras.splice(+el.dataset.i, 1); render(); break;
    case 'recurFreq': d.recur.freq = el.dataset.v; render(); break;
    case 'recurCount': d.recur.count = +el.dataset.v; render(); break;

    /* creazione piano */
    case 'emoji': d.emoji = EMOJIS[(EMOJIS.indexOf(d.emoji) + 1) % EMOJIS.length]; render(); break;
    case 'preset': d.emoji = el.dataset.emoji; d.title = el.dataset.title; render(); break;
    case 'mode': d[el.dataset.k] = el.dataset.v; render(); break;
    case 'toggle': { const ks = el.dataset.path.split('.'); let o = d; ks.slice(0,-1).forEach(k => { o = o[k]; }); o[ks[ks.length-1]] = !o[ks[ks.length-1]]; render(); break; }
    case 'quickFixedWhen': d.whenFixed = { start:el.dataset.start, end:el.dataset.end, allDay:el.dataset.allday === '1' }; render(); break;
    case 'quickWhen': { if(d.whenCands.length >= 5) break; const c = parseWhen(el.dataset.start, el.dataset.end, el.dataset.allday === '1'); if(d.whenCands.some(x => x.start === c.start)){ toast(t('Già tra le opzioni')); break; } d.whenCands.push(c); render(); break; }
    case 'addWhen': { const v = $('#whenAdd').value; if(!v){ toast('Scegli una data'); break; } if(d.whenCands.some(x => x.start === v)){ toast(t('Già tra le opzioni')); break; } d.whenCands.push(parseWhen(v, '', false)); render(); break; }
    case 'rmWhen': d.whenCands = d.whenCands.filter(x => x.id !== el.dataset.id); render(); break;
    case 'quickFixedWhere': { const pl = savedPlace(el.dataset.name); d.whereFixed = { name:el.dataset.name, address:el.dataset.address, photo: pl && pl.photos.length ? pl.photos[0].dataUrl : '' }; if(pl) pl.used += 1; render(); break; }

    case 'rmWhere': d.whereCands = d.whereCands.filter(x => x.id !== el.dataset.id); render(); break;
    case 'quickDeadline': d.deadline = el.dataset.v; render(); break;
    case 'allowDraft': d.allowProposals = !d.allowProposals; render(); break;

      if(d.step === 2){ if(d.whenMode === 'fixed' && !d.whenFixed.start){ toast('Scegli data e ora'); break; } if(d.whenMode === 'deciding' && d.whenCands.length < 2){ toast('Servono almeno 2 opzioni'); break; } }
